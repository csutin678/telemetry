<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Telemetry">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a phone app; sticky tab bar; cards set off only where they group a unit (race, week, day list). */
:root{
  --bg:#EEF0F6; --card:#FCFCFE; --ink:#131A33; --ink-2:#5A6178; --ink-3:#8A90A6; --line:#DCDFE9;
  --pill:#141B33; --pill-fg:#FFFFFF;
  --go:#2E6A4E; --go-soft:#DCEBE2; --warn:#D9646C; --warn-soft:#F6DFE1;
  --easy:#2E7D57; --quality:#3E6ED6; --long:#C98A1B; --race:#D9646C; --cross:#2E8A8A; --strength:#8358C9; --rest:#6B7590;
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
}
:root{color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--long);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* header + tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font:800 22px/1 var(--f-display);letter-spacing:-.01em}
.brand h1 span{color:var(--go)}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--go);display:inline-block}
.sync.busy i{background:var(--race);animation:pulse 1s infinite}
.sync.err i{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;padding:6px 0;display:grid;justify-items:center;gap:3px;font:600 10.5px var(--f-display);color:var(--ink-3)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.3}
.modes{display:flex;gap:4px;overflow-x:auto;margin-top:26px;background:var(--line);padding:4px;border-radius:14px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font:600 13.5px var(--f-display);color:var(--ink-2);white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,27,51,.08)}
.filters{padding:14px 16px;display:grid;gap:8px}
.filters .f select,.filters .f input{padding:8px 10px}
.linkbtn{justify-self:start;border:0;background:none;padding:2px 0;color:var(--quality);font-weight:600;font-size:13.5px}
.mixbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.mixbar button{display:block;height:100%;border:0;padding:0;border-right:2px solid var(--card)}
.mixbar button:last-child{border-right:0}
.mixbar{height:22px!important}

h2.sec{font:800 26px/1.1 var(--f-display);letter-spacing:-.015em;margin:28px 0 4px;text-wrap:balance}
p.sub{margin:0 0 14px;color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.stack{display:grid;gap:12px}
.banner{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13px}

/* races */
.race{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;padding:16px 18px}
.race .dist{font:800 30px/1 var(--f-display);letter-spacing:-.02em}
.race .name{font:700 17px/1.2 var(--f-display)}
.race .meta{color:var(--ink-2);font-size:14px}
.race .days{text-align:right}
.race .days b{display:block;font:800 30px/1 var(--f-display)}
.race .days small{color:var(--ink-2)}
.race{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.race.next{border:2px solid var(--race);box-shadow:inset 5px 0 0 var(--race)}
.race:hover{border-color:var(--ink-3)}
.race.done{opacity:.55}

/* week pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font:600 14px var(--f-display);white-space:nowrap;scroll-snap-align:start}
.pill[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.pill small{font-weight:500;opacity:.7}

/* week card */
.weekcard{padding:20px 22px}
.wk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font:800 46px/1 var(--f-display);letter-spacing:-.03em}
.big.warn{color:var(--warn)}
.big.go{color:var(--go)}
.bar{height:10px;border-radius:99px;background:var(--line);margin:16px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .4s}
.wk-note{color:var(--ink-2);margin:0;font-size:14.5px}

/* day list */
.days{margin-top:14px;overflow:hidden}
.day{display:grid;grid-template-columns:56px 1fr 52px;gap:12px;padding:18px 18px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.is-today{background:linear-gradient(90deg,var(--go-soft) 0%,color-mix(in srgb,var(--go-soft) 55%,transparent) 45%,transparent 100%)}
.day.sub{padding-top:2px;border-top:0}
.day.sub h3{font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day.sub .tick{width:36px;height:36px;justify-self:center}
.day.sub .tick svg{width:16px;height:16px}
.day .dnum{font:800 28px/1 var(--f-display)}
.day .dname{color:var(--ink-2);font-size:13px;font-weight:600;line-height:1.2;margin-top:4px}
.day h3{margin:0;font:700 17px/1.25 var(--f-display)}
.day.is-done h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-3)}
.day.is-done .desc{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 60%,transparent)}
.prow h3.struck,.pline.struck{text-decoration:line-through;color:var(--ink-3)}
.day.is-rest h3{color:var(--ink-3)}
.desc{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.chip{font:600 12.5px var(--f-body);padding:4px 10px;border-radius:8px;background:var(--go-soft);color:var(--go)}
.chip.k-quality{background:color-mix(in srgb,var(--quality) 14%,transparent);color:var(--quality)}
.chip.k-long{background:color-mix(in srgb,var(--long) 16%,transparent);color:var(--long)}
.chip.k-race{background:color-mix(in srgb,var(--race) 18%,transparent);color:var(--race)}
.chip.k-cross{background:color-mix(in srgb,var(--cross) 14%,transparent);color:var(--cross)}
.chip.k-strength{background:color-mix(in srgb,var(--strength) 14%,transparent);color:var(--strength)}
.actual{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13.5px}
.actual input{width:68px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;align-self:start}
.tick svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.tick.on{background:var(--go);border-color:var(--go)}
.tick.on svg{opacity:1}
.tick:hover{border-color:var(--go)}

/* summary */
.hello{margin:16px 0 0;font:800 25px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.panel{padding:0;overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 16px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;font:inherit;color:inherit}
.prow:first-child{border-top:0}
.prow.glow{background:linear-gradient(90deg,var(--go-soft) 0%,color-mix(in srgb,var(--go-soft) 50%,transparent) 50%,transparent 100%)}
.prow h3{margin:1px 0 0;font:700 18px/1.2 var(--f-display)}
.prow h3.struck{text-decoration:line-through;color:var(--ink-3)}
.prow .mono{font-size:10.5px}
.pline{font:700 16px/1.25 var(--f-display)}
.pline small{font:500 13px var(--f-body);color:var(--ink-2)}
.pside{font-size:13px;color:var(--ink-2);white-space:nowrap}
.warn-t{color:var(--warn);font-weight:600}.go-t{color:var(--go);font-weight:600}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc.one{margin-top:1px;font-size:13px}
.btn.sm{padding:8px 14px;font-size:13.5px}
.bar.thin{height:7px;margin:8px 0 2px}
.race-row{cursor:pointer}
.race-row:hover{background:var(--bg)}
.race-row.r3{grid-template-columns:44px 1fr auto}
.rdist{font:800 17px var(--f-display);letter-spacing:-.02em}
.cd{text-align:right;line-height:1}
.cd b{display:block;font:800 22px var(--f-display)}
.cd small{font-size:11.5px;color:var(--ink-2)}
.today-card{padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.today-card h3{margin:2px 0 0;font:700 20px/1.2 var(--f-display)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:600 14px var(--f-display);background:var(--pill);color:var(--pill-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi b{display:block;font:800 30px/1.05 var(--f-display);letter-spacing:-.02em;margin-top:6px}
.kpi small{color:var(--ink-2);font-size:13px}
.chart{padding:18px 18px 12px}
.chart h3{margin:0;font:700 17px var(--f-display)}
.chart svg{display:block;width:100%;height:auto;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--ink-2);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .r-km{font:700 17px var(--f-display);text-align:right}
.row .r-sub{color:var(--ink-2);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* calendar */
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 14px;color:var(--ink-2);font-size:14px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tiles.dow span{text-align:center;color:var(--ink-2);font-size:13px;font-weight:600;padding-bottom:4px}
.cal-week{margin-top:16px}
.cal-week header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cal-week h3{margin:0;font:700 17px var(--f-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-week header > span{color:var(--ink-2);font-size:14px;white-space:nowrap}
.nowchip{font:600 12px var(--f-body);background:var(--go-soft);color:var(--go);padding:3px 8px;border-radius:7px}
.tile{position:relative;border:0;border-top:4px solid var(--k);background:color-mix(in srgb,var(--k) 11%,var(--card));border-radius:10px;padding:6px 2px 8px;display:grid;justify-items:center;align-content:start;gap:0;min-width:0;font:inherit;color:var(--ink);cursor:pointer;min-height:76px}
.tile .dn{font:600 12px var(--f-display);color:var(--ink-2)}
.tile .km{font:800 21px/1.15 var(--f-display);min-height:24px}
.tile .lb{font-size:10.5px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tile.done{opacity:.55}
.tile.today{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.tile.is-rest{background:color-mix(in srgb,var(--rest) 8%,var(--card))}
.tile:hover{filter:brightness(.97)}
.gymdot{position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--strength)}
.carbs{padding:16px 18px;margin-bottom:12px}
.kpis.fit{margin-top:8px}
svg.trend{display:block;width:100%;height:34px;margin-top:8px}
.fitcard{padding:14px 16px}
.fitcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fitcard .pline{margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.desc.fine{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
ul.load li small{font-size:12.5px;color:var(--ink-3)}
.tablewrap{overflow-x:auto;margin-top:8px}
table.pred,table.splits{border-collapse:collapse;width:100%;font-size:14px}
table.pred th,table.pred td,table.splits th,table.splits td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.pred th:first-child,table.splits th:first-child,table.splits td:first-child{text-align:left}
table.pred thead th,table.splits thead th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
table.pred tbody th{font:700 15px var(--f-display)}
table.pred td{font:700 16px var(--f-display)}
table.splits tr.partial td{color:var(--ink-3)}
table.splits tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
table.splits td:nth-child(3){position:relative;min-width:84px}
.pbar{position:absolute;left:4px;top:7px;bottom:7px;width:calc(var(--w) * .55);border-radius:4px;background:color-mix(in srgb,var(--quality) 16%,transparent);z-index:0}
table.splits td{position:relative}
.act-head{padding:16px 18px}
.act-head h3{margin:2px 0 10px;font:800 21px/1.2 var(--f-display)}
.act-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act-big b{display:block;font:800 22px/1.1 var(--f-display);letter-spacing:-.02em}
.act-big small{color:var(--ink-2);font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:4px 0}
.metrics .m{padding:10px 14px;border-top:1px solid var(--line);min-width:0}
.metrics .m:nth-child(-n+3){border-top:0}
.metrics .m b{display:block;font:800 20px/1.15 var(--f-display);margin-top:3px}
.metrics .m small{color:var(--ink-2);font-size:12px}
.metrics .m .mono{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.runcharts{padding-bottom:12px}
.rc{margin-top:10px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
.rc-n{font:700 14px var(--f-display);color:var(--ink);display:flex;align-items:center;gap:6px}
.rc-n i{display:inline-block;width:10px;height:10px;border-radius:3px}
.rc-n small{font:500 11.5px var(--f-body);color:var(--ink-3)}
.rc-h b{color:var(--ink);font-family:var(--f-display)}
.rc-h small{color:var(--ink-3)}
.rc svg{display:block;width:100%;height:auto;margin-top:3px}
.rc svg.rwstrip{height:auto}
.zones{display:grid;gap:8px;margin-top:10px}
.runpick{margin-bottom:10px}
.runpick .prow{cursor:pointer;border-left:4px solid transparent}
.runpick .prow[aria-checked="true"]{background:linear-gradient(90deg,var(--go-soft) 0%,color-mix(in srgb,var(--go-soft) 40%,transparent) 60%,transparent 100%);border-left-color:var(--go)}
.runpick .prow:hover{background-color:var(--bg)}
.zrow{display:grid;grid-template-columns:118px 1fr 64px;gap:10px;align-items:center}
.zl{font:700 15px var(--f-display)}
.zl small,.zv small{display:block;font:500 11.5px var(--f-body);color:var(--ink-3)}
.zbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.zbar i{display:block;height:100%;border-radius:99px}
.zv{text-align:right;font:700 14px var(--f-display)}
.stack > .kpis, .stack > .fitcard{margin:0}
.carb-big{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:4px}
.carb-big small{font:500 15px var(--f-body);color:var(--ink-2)}
ul.load{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
ul.load li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.load li span:last-child{color:var(--ink-2)}
svg.spark{display:block;width:100%;height:auto;margin:4px 0}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.cal-head h2{margin:0;font:800 26px var(--f-display)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:600 18px var(--f-display)}
.cal{padding:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;padding:4px 0 6px}
.cell{min-height:64px;border:0;border-radius:10px;background:transparent;padding:6px 4px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:hover{background:var(--bg)}
.cell.out{opacity:.35}
.cell .n{font:600 13px var(--f-display)}
.cell.today .n{background:var(--pill);color:var(--pill-fg);border-radius:6px;padding:0 5px;align-self:flex-start}
.cell.sel{background:var(--bg);outline:1.5px solid var(--ink-3)}
.seg{height:16px;border-radius:4px;font:600 10px/16px var(--f-mono);padding:0 3px;overflow:hidden;white-space:nowrap;color:#fff}
.seg.plan{background:transparent;border:1.5px dashed currentColor;line-height:13px}
.cal-key{display:flex;flex-wrap:wrap;gap:12px;margin:10px 4px 2px;color:var(--ink-2);font-size:12.5px}

/* nutrition */
.form{padding:16px 18px;display:grid;gap:10px;margin-bottom:12px}
.form .two{display:grid;grid-template-columns:1fr 110px;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.f textarea{min-height:64px;resize:vertical}
.seg-btns{display:flex;flex-wrap:wrap;gap:6px}
.seg-btns button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.seg-btns button[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.dayfood{padding:16px 18px}

@media (max-width:380px){.big{font-size:38px}.race{grid-template-columns:56px 1fr auto}.race .dist{font-size:24px}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Telemetry<span>.</span></h1>
      <button class="sync mono" id="sync" style="border:0;background:none;padding:6px 0" aria-label="Connection settings"><i></i><span id="syncText">Loading</span></button>
    </div>
    <div class="banner" id="previewBanner" hidden>Preview with a snapshot of your sheet. Changes stay in this page and are not saved to Google Sheets.</div>
  </header>
  <main id="view"><div class="empty">Loading your sheet…</div></main>
</div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="summary" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></button>
  <button role="tab" data-tab="training" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg><span>Training</span></button>
  <button role="tab" data-tab="calendar" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
  <button role="tab" data-tab="activity" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg><span>Activity</span></button>
  <button role="tab" data-tab="nutrition" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0zM12 11V4M9 6.5c1-1.5 5-1.5 6 0"/></svg><span>Nutrition</span></button>
</nav>
<div id="sheetRoot"></div>

<script>
/* ================= API ================= */
const IS_PREVIEW = !!window.TELEMETRY_SNAPSHOT;
const APP_VERSION = '2026.10.28-1';
/* Connection to your Apps Script (saved on this device only) */
const CONF = {
  get url() { try { return localStorage.getItem('telemetry.url') || ''; } catch (e) { return ''; } },
  get key() { try { return localStorage.getItem('telemetry.key') || ''; } catch (e) { return ''; } },
  save(url, key) { try { localStorage.setItem('telemetry.url', url); localStorage.setItem('telemetry.key', key); } catch (e) {} },
  get ready() { return !!(this.url && this.key); }
};
const API = {
  async call(fn, ...args) {
    if (IS_PREVIEW) return new Promise(res => setTimeout(() => res(Mock[fn](...args)), 250));
    return API.raw(CONF.url, CONF.key, fn, args);
  },
  async raw(url, key, fn, args = []) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key, fn, args }) });
    if (!r.ok) throw new Error('The sheet link answered ' + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j.result;
  }
};

/* Mock backend for the preview: mirrors Code.gs on the in-page snapshot. */
const Mock = (() => {
  let raw = window.TELEMETRY_SNAPSHOT ? JSON.parse(JSON.stringify(window.TELEMETRY_SNAPSHOT)) : null;
  const IDX = {activity:3,type:4,km:6,time:7,hr:9,rpe:10,sleep:11,shoes:13,strides:15,notes:17};
  const put = (row, p, skipActivity) => { for (const k in IDX) { if (p[k] === undefined || (skipActivity && k === 'activity')) continue; row[IDX[k]] = String(p[k]); } if (p.km || p.time) row[16] = 'Yes'; };
  const filled = r => (r[6] || '') !== '' || (r[7] || '') !== '';
  return {
    getData: () => JSON.parse(JSON.stringify(raw)),
    saveSession(p) {
      if (p.logRow) { const r = raw.log.find(x => x[0] === p.logRow); if (r) put(r, p, true); }
      let r = [...raw.s1, ...raw.s2].find(x => x[2] === p.date && (x[3] === p.activity || x[3] === p.prevActivity) && filled(x))
        || (p.preferS2 ? null : raw.s1.find(x => x[2] === p.date && !filled(x)));
      if (!r && p.preferS2) { r = [9500 + raw.s2.length, '', p.date, '', '', '', '', '', '', '', '', '', '', '', 'FALSE', '', '', '']; raw.s2.push(r); }
      if (!r) { r = [9000 + raw.s2.length, '', p.date, '', '', '', '', '', '', '', '', '', '', '', 'FALSE', '', '', '']; (raw.s1.some(x => x[2] === p.date) ? raw.s2 : raw.s1).push(r); }
      put(r, p, false);
      return { ok: true, data: this.getData() };
    },
    clearSession(p) {
      const blank = {km:'',time:'',hr:'',rpe:'',sleep:'',strides:''};
      if (p.logRow) { const r = raw.log.find(x => x[0] === p.logRow); if (r) { put(r, blank, true); r[16] = ''; } }
      const r = [...raw.s1, ...raw.s2].find(x => x[2] === p.date && x[3] === p.activity && filled(x));
      if (r) { put(r, blank, true); r[16] = ''; }
      return { ok: true, data: this.getData() };
    },
    addMeal(m) { raw.nutrition = raw.nutrition || []; raw.nutrition.push([raw.nutrition.length + 2, Math.random().toString(36).slice(2, 10), m.date, m.meal, m.item, String(m.kcal), m.notes || '']); return { ok: true, data: this.getData() }; },
    addWeight(w) { raw.weights = (raw.weights || []).filter(r => r[1] !== w.date); raw.weights.push([0, w.date, String(w.kg)]); raw.weights.sort((a, b) => a[1].localeCompare(b[1])); return { ok: true, data: this.getData() }; },
    activity(id) {
      const ex = window.TELEMETRY_EXAMPLE_ACTIVITY; if (!ex) return { error: 'Preview: activities come from Garmin on the live app.' };
      const recent = [['example', 'Example run A', 0, 10.1], ['example-2', 'Example run B', -2, 8.0], ['example-3', 'Example run C', -4, 14.0]].map(([rid, n, off, km]) => ({ id: rid, name: n, date: addDays(TODAY, off) + ' 06:00', type: 'running', km }));
      const pick = recent.find(r => r.id === id) || recent[0];
      return { ...JSON.parse(JSON.stringify(ex)), id: pick.id, name: pick.name + ' (preview only)', start: pick.date + ':00', recent };
    },
    syncGarmin() { return { added: [], sleepFilled: 0, errors: ['Preview: Garmin sync runs on the live app only.'], data: this.getData() }; },
    deleteMeal(id) { raw.nutrition = (raw.nutrition || []).filter(r => r[1] !== id); return { ok: true, data: this.getData() }; }
  };
})();

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = D(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay = s => { const d = D(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtShort = s => { const d = D(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const km1 = n => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '');
const secs = t => { if (!t) return 0; const p = String(t).split(':').map(Number); if (p.some(isNaN)) return 0; return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p.length === 2 ? p[0]*60 + p[1] : 0; };
const hm = s => { s = Math.round(s || 0); return `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}`; };
const paceStr = s => { if (!s || !isFinite(s)) return '—'; const m = Math.floor(s / 60), r = Math.round(s % 60); return r === 60 ? `${m+1}:00` : `${m}:${pad(r)}`; };
const parseLoose = s => { const m = String(s).match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/); if (!m) return /^\d{4}-\d\d-\d\d$/.test(s) ? s : null; const mi = MON.indexOf(m[1].slice(0,1).toUpperCase() + m[1].slice(1,3).toLowerCase()); return mi < 0 ? null : iso(new Date(+m[3], mi, +m[2])); };
const TODAY = iso(new Date());

function kindOf(activity, type) {
  const s = `${activity} ${type}`;
  if (/rest/i.test(activity) && !type) return 'rest';
  if (/race|half marathon$/i.test(s) && !/pace/i.test(s)) return 'race';
  if (/quality|tempo|interval|×|x\d|progression|fartlek|marathon pace|norwegian/i.test(s)) return 'quality';
  if (/long/i.test(s)) return 'long';
  if (/^run|social run|shakeout|easy|recovery/i.test(s)) return 'easy';
  if (/strength/i.test(s)) return 'strength';
  return 'cross';
}
const isRun = (activity, type) => /^run|social run/i.test(activity) || /run|tempo|pace|×|race|half marathon/i.test(type || '');
const KIND_LABEL = {easy:'Easy', quality:'Quality', long:'Long', race:'Race', cross:'Cross-training', strength:'Strength', rest:'Rest'};

const WORKOUT_NOTES = {
  'Easy Run': 'Conversational pace, HR in zone 2. Add 4–6 relaxed strides at the end if legs feel good.',
  'Recovery Run': 'Very easy and short. Slower than easy pace; walk breaks are fine.',
  'Long Run': 'Steady, easy effort. Fuel and drink from 45 minutes in. Finish feeling you could go further.',
  'Tempo': 'Warm up, then comfortably hard at about half-marathon to 10K effort. Cool down after.',
  'Tempo (reduced volume)': 'Shorter tempo block than usual. Stay controlled; this is taper week.',
  'Broken Tempo': 'Tempo effort split into blocks with short jog recoveries.',
  'Progression Run': 'Start easy and finish around half-marathon pace over the last third.',
  'Half Marathon Pace': 'Warm up, then blocks at goal race pace with easy jog recoveries.',
  'Norwegian 4×4': '4 × 4 min hard (about 90% max HR) with 3 min easy jog between.',
  '6×800': '6 × 800 m at 5K effort, 2–3 min jog recovery.',
  '8×400': '8 × 400 m quick and relaxed, 90 s jog recovery.',
  '8×200': '8 × 200 m fast with full recovery. Focus on form.',
  'Fartlek': 'Unstructured surges by feel inside an easy run.',
  'Half Marathon': 'Race day. Start controlled, settle into goal pace, fuel on schedule.',
  '10K Race': 'Race effort.', '5K Race': 'Race effort.'
};
const CROSS_NOTES = {
  Soccer: 'Team session. Keep it relaxed if legs are heavy from Monday.',
  Tennis: 'Court session. Counts as cross-training.',
  Badminton: 'Court session. Keep it light before Saturday’s long run.',
  Rest: 'No training. Sleep and eat well.'
};

function prettyTitle(activity, type) {
  let a = String(activity).replace(/^Run:\s*/i, '').replace(/^Quality\s*[—-]\s*/i, '');
  const map = {'Easy + optional Strides':'Easy run + strides','Easy (short) + optional Strides':'Short easy run + strides','Easy':'Easy run','Long':'Long run','Recovery':'Recovery run','Shakeout':'Shakeout','Race':'Race day','Quality':type || 'Quality session'};
  return map[a] || a;
}

/* ================= model ================= */
let RAW = null, M = null;
const state = { tab: 'summary', week: null, calMonth: null, calSel: TODAY };
try { const m = localStorage.getItem('telemetry.trainMode'); if (m) state.trainMode = m; } catch (e) {}

function build(raw) {
  const c = (r, L) => r['ABCDEFGHIJKLMNOPQ'.indexOf(L) + 1] ?? '';
  const sess = (r, src) => ({
    src, row: r[0], date: c(r,'B'), activity: c(r,'C'), type: c(r,'D'),
    planned: num(c(r,'E')), km: num(c(r,'F')), time: c(r,'G'), pace: c(r,'H'), hr: num(c(r,'I')),
    rpe: c(r,'J'), sleep: c(r,'K'), load: num(c(r,'L')), shoes: c(r,'M'), strides: c(r,'O'),
    completed: c(r,'P'), notes: c(r,'Q'), week: num(c(r,'A'))
  });
  const done = s => s.completed === 'Yes' || s.km > 0 || secs(s.time) > 0;

  // Sessions history (Session 1 + Session 2)
  const history = [...(raw.s1 || []).map(r => sess(r, 'Session 1')), ...(raw.s2 || []).map(r => sess(r, 'Session 2'))]
    .filter(s => done(s)).sort((a, b) => a.date.localeCompare(b.date));
  history.forEach((s, i) => { s.idx = i; s.kind = kindOf(s.activity, s.type); s.run = isRun(s.activity, s.type) && s.km > 0; s.paceSec = s.km ? secs(s.time) / s.km : 0; });
  const runs = history.filter(s => s.run);

  // Race day from the Schedule tab
  const rd = (raw.sched || []).find(r => /race date/i.test(r[1]));
  const raceDate = rd ? parseLoose(rd[2]) : null;

  // Plan (Training Log)
  const plan = (raw.log || []).map(r => sess(r, 'log'));
  // Show the race on the Schedule's race date (display only; each row keeps its own date for logging)
  if (raceDate) {
    const raceRow = plan.find(p => /race/i.test(p.activity) && p.date !== raceDate && daysBetween(p.date, raceDate) > 0 && daysBetween(p.date, raceDate) < 7);
    const target = plan.find(p => p.date === raceDate);
    if (raceRow && target && !done(target)) {
      for (const k of ['activity','type','planned']) [raceRow[k], target[k]] = [target[k], raceRow[k]];
    }
  }
  plan.forEach(p => { p.kind = kindOf(p.activity, p.type); p.run = isRun(p.activity, p.type); p.done = done(p); p.title = prettyTitle(p.activity, p.type); });

  // Weekly planned km from the Schedule tab (columns I, J, K), as the sheet's own dashboard does
  const schedKm = {}, schedPart = {};
  (raw.sched || []).forEach(r => { if (/^\d+$/.test(String(r[1]).trim()) && r.length > 9) { schedKm[+r[1]] = num(r[9]) + num(r[10]) + num(r[11]); schedPart[+r[1]] = { easy: num(r[9]), quality: num(r[10]) }; } });
  // Easy and quality days carry their km on the Schedule tab (columns I, J), not in the log
  plan.forEach(p => { if (p.run && !p.planned && schedPart[p.week]) { const v = schedPart[p.week][p.kind]; if (v) p.planned = v; } });

  // Weeks
  const byWeek = new Map();
  plan.forEach(p => { if (!byWeek.has(p.week)) byWeek.set(p.week, []); byWeek.get(p.week).push(p); });
  const weeks = [...byWeek.entries()].sort((a, b) => a[0] - b[0]).map(([n, rows]) => {
    rows.sort((a, b) => a.date.localeCompare(b.date) || a.row - b.row);
    const start = monday(rows.reduce((m, r) => r.date > m ? r.date : m, rows[0].date));
    const end = addDays(start, 6);
    const sw = schedKm[n];   // Schedule tab: easy + quality + long km for the week
    const planned = sw != null ? sw : rows.reduce((s, r) => s + r.planned, 0);
    const from = rows[0].date < start ? rows[0].date : start; // a credited run before Monday still counts
    const actual = runs.filter(r => r.date >= from && r.date <= end).reduce((s, r) => s + r.km, 0);
    const countable = rows.filter(r => r.kind !== 'rest');
    return { n, start, end, rows, planned, actual, sessions: countable.length, ticked: countable.filter(r => r.done).length };
  });
  const planStart = plan.length ? plan.reduce((m, p) => p.date < m ? p.date : m, plan[0].date) : TODAY;
  const planEnd = weeks.length ? weeks[weeks.length - 1].end : TODAY;
  const blockRuns = runs.filter(r => r.date >= planStart && r.date <= planEnd);
  const block = {
    start: planStart, end: planEnd,
    planned: weeks.reduce((s, w) => s + w.planned, 0),
    actual: blockRuns.reduce((s, r) => s + r.km, 0),
    longest: blockRuns.reduce((m, r) => r.km > m.km ? r : m, { km: 0 }),
    quality: blockRuns.filter(r => r.kind === 'quality').length,
    runs: blockRuns.length
  };
  const current = weeks.find(w => TODAY >= w.start && TODAY <= w.end) || (TODAY < planStart ? weeks[0] : weeks[weeks.length - 1]);

  // Races
  const races = (raw.races || []).filter(r => r[1] && !/^race$|planned races|^source/i.test(r[1])).map(r => ({
    name: r[1], date: /^\d{4}-/.test(r[2]) ? r[2] : parseLoose(r[2]), dist: num(r[3]), status: r[4], notes: r[5]
  })).map(r => ({ ...r, goal: r.date && r.date === raceDate }));
  races.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));

  // Library
  const lib = (raw.lib || []).slice(1);
  const types = lib.map(r => r[1]).filter(Boolean);
  const shoes = lib.map(r => r[3]).filter(Boolean);

  // Nutrition
  const meals = (raw.nutrition || []).filter(r => r[1] && r[2]).map(r => ({ id: r[1], date: /^\d{4}-/.test(r[2]) ? r[2] : parseLoose(r[2]), meal: r[3], item: r[4], kcal: num(r[5]), notes: r[6] }));

  const weights = (raw.weights || []).filter(r => r[1] && num(r[2])).map(r => ({ date: /^\d{4}-/.test(r[1]) ? r[1] : parseLoose(r[1]), kg: num(r[2]) })).filter(w => w.date).sort((a, b) => a.date.localeCompare(b.date));
  const garminDaily = (raw.garminDaily || []).filter(r => /^\d{4}-\d\d-\d\d/.test(r[1])).map(r => {
    const n = v => (v === '' || v == null ? null : num(v));
    return { date: r[1].slice(0, 10), hrv: n(r[2]), hrv7: n(r[3]), hrvStatus: r[4] || '', hrvLo: n(r[5]), hrvHi: n(r[6]), rhr: n(r[7]), rhr7: n(r[8]), bb: n(r[9]), stress: n(r[10]), load: n(r[11]), vo2: n(r[12]), sleep: n(r[13]) };
  }).sort((a, b) => a.date.localeCompare(b.date));
  const fitness = (raw.fitness || []).map(r => ({ label: /^\d{4}-\d\d-\d\d$/.test(r[0]) ? MON[+r[0].slice(5, 7) - 1] + ' ' + r[0].slice(0, 4) : r[0], vo2: num(r[1]) || null, ltHr: r[2], ltPace: r[3] })).filter(f => f.label);
  return { plan, weeks, current, block, history, runs, races, raceDate, types, shoes, meals, weights, garminDaily, fitness, done };
}

/* ================= rendering ================= */
const view = $('#view');
function setSync(mode, text) { const s = $('#sync'); s.className = 'sync mono ' + (mode || ''); $('#syncText').textContent = text; }

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  if (!M) return;
  ({ summary: renderSummary, training: renderTraining, calendar: renderCalendar, activity: renderActivity, nutrition: renderNutrition })[state.tab]();
}

function raceRow(r) {
  const left = r.date ? daysBetween(TODAY, r.date) : null;
  const dist = r.dist ? (r.dist >= 42 ? '42K' : r.dist >= 21 ? '21K' : `${Math.round(r.dist)}K`) : '—';
  return `<button class="prow race-row r3" data-race="${M.races.indexOf(r)}" aria-label="Details for ${esc(r.name)}">
    <span class="rdist">${dist}</span>
    <div style="min-width:0"><div class="pline one">${esc(r.name)}</div><div class="desc one">${r.date ? esc(fmtDay(r.date)) : 'Date to confirm'}${r.goal ? ' · Goal race' : r.status ? ' · ' + esc(r.status) : ''}</div></div>
    <div class="cd">${left === null ? '<small>TBC</small>' : left === 0 ? '<b>0</b><small>today</small>' : `<b class="num">${left}</b><small>days</small>`}</div>
  </button>`;
}

function raceCard(r, next) {
  const left = r.date ? daysBetween(TODAY, r.date) : null;
  const dist = r.dist ? (r.dist >= 42 ? '42K' : r.dist >= 21 ? '21K' : `${Math.round(r.dist)}K`) : '—';
  const meta = [r.date ? fmtDay(r.date) : 'Date to confirm', r.goal ? 'Goal race' : r.status].filter(Boolean).join(', ');
  const cls = left !== null && left < 0 ? 'done' : next ? 'next' : '';
  return `<button class="card race ${cls}" data-race="${M.races.indexOf(r)}" aria-label="Details for ${esc(r.name)}">
    <div class="dist">${dist}</div>
    <div style="min-width:0"><div class="name">${esc(r.name)}</div><div class="meta">${esc(meta)}</div></div>
    <div class="days">${left === null ? '<small>TBC</small>' : left < 0 ? `<small>${esc(r.status || 'Done')}</small>` : left === 0 ? '<b>0</b><small>race day</small>' : `<b class="num">${left}</b><small>days to go</small>`}</div>
  </button>`;
}

/* ---------- filters (mirror the sheet's Dashboard: Chart view, Run type, From, To) ---------- */
const VIEWS = [['program', '10-week program'], ['12w', 'Last 12 weeks'], ['6m', 'Last 6 months'], ['all', 'All history']];
const RUN_TYPES = [['all', 'All runs'], ['easy', 'Easy'], ['recovery', 'Recovery'], ['quality', 'Quality'], ['long', 'Long'], ['race', 'Race']];
state.filter = { view: 'program', type: 'all', from: '', to: '' };
try { const f = JSON.parse(localStorage.getItem('telemetry.filter') || 'null'); if (f) state.filter = { ...state.filter, ...f }; } catch (e) {}
const saveFilter = () => { try { localStorage.setItem('telemetry.filter', JSON.stringify(state.filter)); } catch (e) {} };

function filterRange() {
  const f = state.filter;
  let a, b;
  if (f.view === 'program') { a = M.block.start; b = M.block.end; }
  else if (f.view === '12w') { a = addDays(monday(TODAY), -77); b = addDays(monday(TODAY), 6); }
  else if (f.view === '6m') { a = monday(addDays(TODAY, -182)); b = addDays(monday(TODAY), 6); }
  else { a = M.history.length ? monday(M.history[0].date) : TODAY; b = addDays(monday(TODAY), 6); }
  if (f.from) a = f.from;
  if (f.to) b = f.to;
  return [a, b];
}
const isRecovery = r => /recovery/i.test(`${r.activity} ${r.type}`);
function typeMatch(r, t) {
  if (t === 'all') return true;
  if (t === 'recovery') return isRecovery(r);
  if (t === 'easy') return r.kind === 'easy' && !isRecovery(r);
  return r.kind === t;
}
function filteredRuns() {
  const [a, b] = filterRange();
  return M.runs.filter(r => r.date >= a && r.date <= b && typeMatch(r, state.filter.type));
}
function filterLabel() {
  const f = state.filter, [a, b] = filterRange();
  const v = VIEWS.find(x => x[0] === f.view)[1], t = RUN_TYPES.find(x => x[0] === f.type)[1];
  return (f.from || f.to) ? `${fmtShort(a)} – ${fmtShort(b)} · ${t}` : `${v} · ${t}`;
}

function filterBar() {
  const f = state.filter;
  return `<div class="card filters">
    <div class="grid2">
      <label class="f">Chart view<select id="fView">${VIEWS.map(([k, l]) => `<option value="${k}" ${k === f.view ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="f">Run type<select id="fType2">${RUN_TYPES.map(([k, l]) => `<option value="${k}" ${k === f.type ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="f">From<input id="fFrom" type="date" value="${f.from}"></label>
      <label class="f">To<input id="fTo" type="date" value="${f.to}"></label>
    </div>
    ${(f.from || f.to || f.view !== 'program' || f.type !== 'all') ? '<button class="linkbtn" id="fReset">Reset filters</button>' : ''}
  </div>`;
}

      ${fitnessSection()}

      <h2 class="sec" style="margin-bottom:0">Trends</h2>
      ${filterBar()}
      <div class="kpis">
        <div class="card kpi"><span class="mono">Total run km</span><b class="num">${km1(total)}</b><small>${fr.length} runs logged</small></div>
        <div class="card kpi"><span class="mono">Longest run</span><b class="num">${longest.km ? km1(longest.km) + ' km' : '—'}</b><small>${longest.date ? esc(fmtShort(longest.date)) : 'No runs in range'}</small></div>
        <div class="card kpi"><span class="mono">Avg pace</span><b class="num">${kmTimed ? paceStr(secsTot / kmTimed) : '—'}</b><small>min/km, distance-weighted</small></div>
        <div class="card kpi"><span class="mono">${state.filter.type === 'all' ? 'Quality runs' : 'Latest run'}</span><b class="num">${state.filter.type === 'all' ? quality : (latest ? km1(latest.km) + ' km' : '—')}</b><small>${latest ? `Latest ${esc(fmtShort(latest.date))}, ${km1(latest.km)} km` : ''}</small></div>
      </div>

      <div class="card chart"><h3>Pace and heart rate</h3><div class="legend"><span><i style="background:var(--quality)"></i>Pace, min/km (higher on chart = faster)</span><span><i style="background:var(--race)"></i>Avg HR, bpm</span></div>${paceHrChart(fr)}</div>

function runRow(r) {
  return `<div class="row tap" role="button" tabindex="0" data-hist="${r.idx}" aria-label="Details for ${esc(fmtDay(r.date))}">

    <div class="r-sub">${esc(r.time || '')}${r.paceSec ? ` · ${paceStr(r.paceSec)}/km` : ''}${r.hr ? ` · ${Math.round(r.hr)} bpm` : ''}</div></div>
    <div class="r-km num">${km1(r.km)}<small style="font-weight:500;color:var(--ink-2)"> km</small></div></div>`;
}

/* weekly buckets for the current filter range */
function weekBuckets(fr) {
  const [a, b] = filterRange();
  const out = [];
  for (let wk = monday(a); wk <= b && out.length < 80; wk = addDays(wk, 7)) {
    const pw = M.weeks.find(x => x.start === wk);
    const from = pw && pw.n === 1 && pw.rows[0].date < wk ? pw.rows[0].date : wk;
    const rs = fr.filter(r => r.date >= from && r.date <= addDays(wk, 6));
    const km = rs.reduce((s, r) => s + r.km, 0), sec = rs.reduce((s, r) => s + secs(r.time), 0);
    out.push({ wk, km, runs: rs.length, sec, planned: state.filter.view === 'program' && pw ? pw.planned : null, label: pw && state.filter.view === 'program' ? `W${pw.n}` : fmtShort(wk), cur: TODAY >= wk && TODAY <= addDays(wk, 6) });
  }
  return out;
}

function volumeChart(fr) {
  const ws = weekBuckets(fr), W = 340, H = 170, L = 30, B = 22, T = 12, R = 6;
  if (!ws.length) return '<div class="empty">No weeks in this range.</div>';
  const max = Math.max(10, ...ws.map(w => Math.max(w.planned || 0, w.km)));
  const step = max > 60 ? 20 : 10, top = Math.ceil(max / step) * step, y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / ws.length, every = Math.ceil(ws.length / 8);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${v}</text>`;
  ws.forEach((w, i) => {
    const x = L + i * bw + bw * 0.16, wid = Math.max(2, bw * 0.68);
    if (w.planned) g += `<rect x="${x}" y="${y(w.planned)}" width="${wid}" height="${Math.max(0, y(0) - y(w.planned))}" rx="3" fill="none" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="3 2"/>`;
    if (w.km > 0) g += `<rect x="${x + (w.planned ? 2 : 0)}" y="${y(w.km)}" width="${wid - (w.planned ? 4 : 0)}" height="${y(0) - y(w.km)}" rx="2.5" fill="var(--go)"/>`;
    if (i % every === 0 || w.cur) g += `<text x="${x + wid / 2}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="${w.cur ? 'var(--ink)' : 'var(--ink-3)'}" font-weight="${w.cur ? 700 : 500}" font-family="var(--f-mono)">${esc(w.label)}</text>`;
    const tipTxt = [`Week of ${fmtShort(w.wk)}`, `${km1(w.km)} km · ${w.runs} run${w.runs === 1 ? '' : 's'}`, w.sec ? `${hm(w.sec)} h running` : '', w.planned ? `Planned ${km1(w.planned)} km (${Math.round(w.km / w.planned * 100)}%)` : ''].filter(Boolean).join('|');
    g += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" class="hit" data-tip="${esc(tipTxt)}"/>`;
    if (w.km > 0 && ws.length <= 14) g += `<text x="${x + wid / 2}" y="${y(w.km) - 4}" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="var(--f-mono)">${Math.round(w.km)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly run kilometres">${g}</svg>`;
}

function paceHrChart(fr) {
  const byW = new Map();
  fr.filter(r => r.paceSec > 0).forEach(r => { const k = monday(r.date); if (!byW.has(k)) byW.set(k, []); byW.get(k).push(r); });
  const pts = [...byW.entries()].sort((a, b) => a[0].localeCompare(b[0])).slice(-26).map(([wk, rs]) => {
    const km = rs.reduce((s, r) => s + r.km, 0), t = rs.reduce((s, r) => s + secs(r.time), 0);
    const hrs = rs.filter(r => r.hr > 0);
    return { wk, pace: t / km, hr: hrs.length ? hrs.reduce((s, r) => s + r.hr, 0) / hrs.length : 0 };
  });
  if (pts.length < 2) return '<div class="empty">Need runs from at least two weeks in this view.</div>';
  const W = 340, H = 180, L = 34, Rr = 34, T = 12, B = 24, n = pts.length;
  const x = i => L + (W - L - Rr) * (i / (n - 1));
  const pv = pts.map(p => p.pace), hv = pts.filter(p => p.hr).map(p => p.hr);
  if (!hv.length) hv.push(140, 150);
  const pMin = Math.floor(Math.min(...pv) / 30) * 30, pMax = Math.max(pMin + 60, Math.ceil(Math.max(...pv) / 30) * 30);
  const hMin = Math.floor((Math.min(...hv) - 2) / 5) * 5, hMax = Math.ceil((Math.max(...hv) + 2) / 5) * 5;
  const yp = v => T + (H - T - B) * ((v - pMin) / (pMax - pMin));
  const yh = v => T + (H - T - B) * (1 - (v - hMin) / (hMax - hMin || 1));
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const pVal = pMin + (pMax - pMin) * i / 3, hVal = hMax - (hMax - hMin) * i / 3, yy = yp(pVal);
    g += `<line x1="${L}" x2="${W - Rr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>
      <text x="${L - 5}" y="${yy + 3.5}" text-anchor="end" font-size="9.5" fill="var(--quality)" font-family="var(--f-mono)">${paceStr(pVal)}</text>
      <text x="${W - Rr + 5}" y="${yy + 3.5}" font-size="9.5" fill="var(--race)" font-family="var(--f-mono)">${Math.round(hVal)}</text>`;
  }
  const line = (arr, f, col) => { const p = arr.map((v, i) => v ? `${x(i)},${f(v)}` : null).filter(Boolean); return `<polyline points="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` + arr.map((v, i) => v ? `<circle cx="${x(i)}" cy="${f(v)}" r="${i === n - 1 ? 4 : 2.6}" fill="${col}"/>` : '').join(''); };
  g += line(pts.map(p => p.pace), yp, 'var(--quality)') + line(pts.map(p => p.hr), yh, 'var(--race)');
  pts.forEach((p, i) => { if (i % Math.ceil(n / 5) === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${fmtShort(p.wk)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly pace and heart rate">${g}</svg>`;
}

function longRunChart() {
  const [a, b] = filterRange();
  const longs = M.runs.filter(r => r.date >= a && r.date <= b && (r.kind === 'long' || r.kind === 'race'));
  const byW = {};
  longs.forEach(r => { const k = monday(r.date); if (!byW[k] || r.km > byW[k].km) byW[k] = r; });
  const pts = Object.keys(byW).sort().map(k => byW[k]);
  // planned long runs still ahead (program view only)
  const ahead = state.filter.view === 'program' ? M.plan.filter(p => p.date > TODAY && (p.kind === 'long' || p.kind === 'race') && p.planned) : [];
  const all = [...pts.map(r => ({ date: r.date, km: r.km, done: true })), ...ahead.map(p => ({ date: p.date, km: p.planned, done: false }))];
  if (all.length < 2) return '<div class="empty">No long runs in this view yet.</div>';
  const W = 340, H = 160, L = 30, R = 10, T = 14, B = 24, n = all.length;
  const top = Math.ceil(Math.max(...all.map(p => p.km)) / 5) * 5, x = i => L + (W - L - R) * (i / (n - 1)), y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += 5) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${v}</text>`;
  const doneIdx = all.map((p, i) => p.done ? i : -1).filter(i => i >= 0);
  if (doneIdx.length > 1) g += `<polyline points="${doneIdx.map(i => `${x(i)},${y(all[i].km)}`).join(' ')}" fill="none" stroke="var(--long)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const lastDone = doneIdx[doneIdx.length - 1];
  const planIdx = all.map((p, i) => !p.done ? i : -1).filter(i => i >= 0);
  if (planIdx.length) g += `<polyline points="${[lastDone ?? planIdx[0], ...planIdx].map(i => `${x(i)},${y(all[i].km)}`).join(' ')}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  all.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.km)}" r="3.4" fill="${p.done ? 'var(--long)' : 'var(--card)'}" stroke="${p.done ? 'var(--long)' : 'var(--ink-3)'}" stroke-width="1.5"/>`;
    if (i % Math.ceil(n / 6) === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${fmtShort(p.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Long run distances">${g}</svg>${ahead.length ? '<div class="legend"><span>Dashed = planned long runs still ahead</span></div>' : ''}`;
}

/* ---------- Training ---------- */
const TRAIN_MODES = [['week', 'Week by week'], ['run', 'Run'], ['badminton', 'Badminton'], ['tennis', 'Tennis'], ['soccer', 'Soccer']];
function todayPanel() {

  const today = plan.filter(p => p.date === TODAY);
  const nextRun = plan.find(p => p.date > TODAY && p.run && !p.done);

  const pct = w.planned ? Math.min(100, w.actual / w.planned * 100) : 0;
  const gym = strengthWeek(TODAY).length;
  return `<div class="card panel">
    ${today.filter(t => t.kind !== 'rest' || today.length === 1).map(t => `<div class="prow ${t.date === TODAY && !t.done && t.kind !== 'rest' ? 'glow' : ''}">

      ${t.kind === 'rest' ? '' : `<button class="btn sm ${t.done ? 'ghost' : ''}" data-log="${t.row}">${t.done ? 'Edit' : 'Log it'}</button>`}
    </div>`).join('') || '<div class="prow"><div><div class="mono">Today</div><h3>Nothing planned</h3></div></div>'}
    ${nextRun ? `<div class="prow"><div style="min-width:0"><div class="mono">Next run</div><div class="pline">${esc(nextRun.title)}</div></div><span class="pside">${esc(fmtDay(nextRun.date))}</span></div>` : ''}
    <div class="prow" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><div class="mono">This week</div><span class="pside">${w.ticked}/${w.sessions} sessions · gym ${gym}/${STRENGTH_TARGET}</span></div>

      <div class="bar thin"><i style="width:${pct}%"></i></div>

  </div>`;
}

function renderTraining() {
  const mode = state.trainMode || 'week';
  const upcoming = M.races.filter(r => !r.date || r.date >= TODAY);
  const nextIdx = upcoming.findIndex(r => r.date);
  view.innerHTML = `
    <h2 class="sec">Today</h2>
    ${todayPanel()}
    <div class="modes" role="tablist" aria-label="Training view">${TRAIN_MODES.map(([k, l]) => `<button role="tab" data-mode="${k}" aria-selected="${k === mode}">${l}</button>`).join('')}</div>
    ${mode === 'week' ? weekView() : workoutView(mode)}`;
  const cur = $('#pills [aria-pressed="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function weekView() {
  const { weeks, block } = M;
  const w = weeks.find(x => x.n === state.week) || M.current;
  state.week = w.n;
  const left = Math.max(0, w.planned - w.actual);
  const pct = w.planned ? Math.min(100, w.actual / w.planned * 100) : 0;
  return `
    <h2 class="sec">Week by week</h2>
    <p class="sub">Tap the circle when a session is done.</p>
    <div class="pills" id="pills">${weeks.map(x => `<button class="pill num" data-week="${x.n}" aria-pressed="${x.n === w.n}">${fmtShort(x.start)}, ${km1(x.planned)} km${x === M.current ? ' <small>· now</small>' : ''}</button>`).join('')}</div>
    <div class="card weekcard" style="margin-top:12px">
      <div class="wk-top">
        <div><div class="big num">${km1(w.actual)}</div><div class="desc">km done this week</div></div>
        <div style="text-align:right"><div class="big num ${left > 0 ? 'warn' : 'go'}">${km1(left)}</div><div class="desc">km to go</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p class="wk-note">Week ${w.n}: planned ${km1(w.planned)} km, ${w.ticked} of ${w.sessions} sessions ticked.<br>Whole block: ${km1(block.actual)} of ${km1(block.planned)} km, ${km1(Math.max(0, block.planned - block.actual))} km left to collect.</p>
    </div>
    <div class="card days">${w.rows.map((r, i) => dayRow(r) + (w.rows[i + 1] && w.rows[i + 1].date === r.date ? '' : strengthSlot(r.date))).join('')}</div>`;
}

function workoutView(mode) {
  const label = TRAIN_MODES.find(m => m[0] === mode)[1];
  const isRunMode = mode === 'run';
  const matchPlan = p => isRunMode ? p.run : p.activity.toLowerCase().includes(mode);
  const matchHist = h => isRunMode ? h.run : h.activity.toLowerCase().includes(mode);
  const { start, end } = M.block;
  const planRows = M.plan.filter(matchPlan);
  const blockPlanned = planRows.length;
  const blockDone = planRows.filter(p => p.done).length;
  const missed = planRows.filter(p => p.date < TODAY && !p.done).length;
  const hist = M.history.filter(matchHist);
  const inBlock = hist.filter(h => h.date >= start && h.date <= end);
  const hours = inBlock.reduce((s, h) => s + secs(h.time), 0) / 3600;
  const upcoming = planRows.filter(p => p.date >= TODAY && !p.done).slice(0, 6);
  const last = hist[hist.length - 1];

  let extra = '';
  if (isRunMode) {
    const kms = { easy: 0, quality: 0, long: 0, race: 0 }, tsec = { easy: 0, quality: 0, long: 0, race: 0 }, cnt = { easy: 0, quality: 0, long: 0, race: 0 };
    inBlock.forEach(h => { if (kms[h.kind] != null) { kms[h.kind] += h.km; tsec[h.kind] += secs(h.time); cnt[h.kind]++; } });
    const tot = Object.values(kms).reduce((s, v) => s + v, 0) || 1;
    const tip = k => [`${KIND_LABEL[k]} runs`, `${km1(kms[k])} km · ${Math.round(kms[k] / tot * 100)}% of block km`, `${hm(tsec[k])} h · ${cnt[k]} run${cnt[k] === 1 ? '' : 's'}`, tsec[k] && kms[k] ? `Avg ${paceStr(tsec[k] / kms[k])}/km` : ''].filter(Boolean).join('|');
    extra = `<div class="card chart"><h3>Block mix by run type</h3>
      <div class="mixbar">${Object.entries(kms).filter(([, v]) => v > 0).map(([k, v]) => `<button style="width:${v / tot * 100}%;background:var(--${segColor(k)})" data-tip="${esc(tip(k))}" aria-label="${esc(tip(k).replace(/\|/g, '. '))}"></button>`).join('')}</div>
      <div class="legend">${Object.entries(kms).map(([k, v]) => `<span><i style="background:var(--${segColor(k)})"></i>${KIND_LABEL[k]} ${km1(v)} km · ${Math.round(v / tot * 100)}%</span>`).join('')}</div>
      <p class="desc" style="margin-top:6px">Tap a segment for hours, km and share.</p></div>`;
  }

  return `
    <h2 class="sec">${esc(label)}</h2>
    <p class="sub">This block: ${esc(fmtShort(start))} – ${esc(fmtShort(end))}</p>
    <div class="kpis">
      <div class="card kpi"><span class="mono">Sessions done</span><b class="num">${blockDone}<small> / ${blockPlanned}</small></b><small>${missed ? `${missed} missed so far` : 'None missed'}</small></div>
      <div class="card kpi"><span class="mono">${isRunMode ? 'Run km' : 'Time'}</span><b class="num">${isRunMode ? km1(inBlock.reduce((s, h) => s + h.km, 0)) : (hours ? hours.toFixed(1) + ' h' : '—')}</b><small>${isRunMode ? `${inBlock.length} runs this block` : `${inBlock.length} logged this block`}</small></div>
      <div class="card kpi"><span class="mono">All time</span><b class="num">${hist.length}</b><small>sessions logged</small></div>
      <div class="card kpi"><span class="mono">Last session</span><b class="num" style="font-size:22px">${last ? esc(fmtShort(last.date)) : '—'}</b><small>${last ? (last.km ? `${km1(last.km)} km` : esc(last.time || '')) : 'Nothing logged yet'}</small></div>
    </div>
    ${extra}
    <h2 class="sec" style="font-size:22px">Coming up</h2>
    <div class="card days">${upcoming.map(dayRow).join('') || '<div class="empty">Nothing planned for the rest of the block.</div>'}</div>
    <h2 class="sec" style="font-size:22px">Logged</h2>
    <div class="card list">${hist.slice(-10).reverse().map(h => h.run ? runRow(h) : `<div class="row tap" role="button" tabindex="0" data-hist="${h.idx}">
        <div><div style="font:800 18px var(--f-display)">${D(h.date).getDate()}</div><div class="r-sub">${MON[D(h.date).getMonth()]}</div></div>
        <div style="min-width:0"><div style="font-weight:600">${esc(h.activity)}</div><div class="r-sub">${esc(String(h.notes || '').slice(0, 80))}</div></div>
        <div class="r-km num">${esc(h.time || '✓')}</div></div>`).join('') || `<div class="empty">No ${esc(label.toLowerCase())} sessions logged yet. Tick one in the plan to start.</div>`}</div>`;
}

function dayRow(p) {
  const d = D(p.date);
  const isToday = p.date === TODAY;
  const desc = p.run ? (WORKOUT_NOTES[p.type] || '') : (CROSS_NOTES[p.activity] || '');
  const chipTxt = `${isToday ? 'Today' : KIND_LABEL[p.kind]}${p.planned ? `, ${km1(p.planned)} km` : ''}`;
  const rest = p.kind === 'rest';
  return `<div class="day ${p.done ? 'is-done' : ''} ${isToday ? 'is-today' : ''} ${rest ? 'is-rest' : ''}">

        ${p.run ? `<label class="actual">Actual <input class="num" inputmode="decimal" data-km="${p.row}" value="${p.km ? km1(p.km) : ''}" placeholder="${p.planned ? km1(p.planned) : '–'}" aria-label="Actual km for ${esc(fmtDay(p.date))}"> km</label>` :
          (p.time ? `<span class="actual">${esc(p.time)}</span>` : '')}

        ${p.done && p.time && p.run ? `<span class="actual num">${esc(p.time)}${p.hr ? ` · ${Math.round(p.hr)} bpm` : ''}</span>` : ''}</div>`}
