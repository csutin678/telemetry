/* ================= Fitness (Dashboard) ================= */
function lastVal(arr, key) { for (let i = arr.length - 1; i >= 0; i--) if (arr[i][key] != null && arr[i][key] !== '') return arr[i]; return null; }

/* Daniels' VO2 cost and %VO2max curves: time (min) to run d metres at a given VDOT. */
function vdotTime(vdot, d) {
  const need = t => { const v = d / t; const vo2 = -4.6 + 0.182258 * v + 0.000104 * v * v; const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t); return vo2 / pct; };
  let lo = 5, hi = 600;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (need(mid) > vdot) lo = mid; else hi = mid; }
  return (lo + hi) / 2 * 60;
}
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };

/* Minimal trend line: no axes or labels, last point emphasised. */
function trendLine(vals, color, label) {
  if (!vals || vals.length < 2) return '';
  const W = 140, H = 34, P = 4, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => P + (W - 2 * P) * i / (vals.length - 1), y = v => P + (H - 2 * P) * (1 - (v - lo) / span);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || `VO2 max trend from ${vals[0]} to ${vals[vals.length - 1]}`)}">
    <polygon points="${x(0)},${H} ${pts} ${x(vals.length - 1)},${H}" fill="${color}" opacity=".1"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3" fill="${color}"/></svg>`;
}

/* Lactate threshold: HR (blue) and pace (red, faster = higher) on their own scales, one shared
   timeline; only the latest value of each is labelled. */
function ltTrend(rows) {
  rows = rows.filter(f => num(f.ltHr) > 0 || secs(f.ltPace) > 0);
  if (rows.length < 2) return '';
  const hr = rows.map(f => num(f.ltHr) > 0 ? num(f.ltHr) : null), pc = rows.map(f => secs(f.ltPace) > 0 ? secs(f.ltPace) : null);
  const W = 190, H = 46, L = 3, R = 54, T = 6, B = 6, n = rows.length;
  const x = i => L + (W - L - R) * i / (n - 1);
  const series = (vals, invert, color, fmt) => {
    const v = vals.filter(z => z != null); if (v.length < 2) return '';
    const lo = Math.min(...v), hi = Math.max(...v), sp = hi - lo || 1;
    const y = z => T + (H - T - B) * (invert ? (z - lo) / sp : 1 - (z - lo) / sp);
    const pts = vals.map((z, i) => z == null ? null : [x(i), y(z)]).filter(Boolean);
    const last = pts[pts.length - 1], lastV = v[v.length - 1];
    return { svg: `<polyline points="${pts.map(p => p.map(c => c.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>`, ly: last[1], label: fmt(lastV), color };
  };
  const a = series(hr, false, 'var(--quality)', v => `${Math.round(v)} bpm`), b = series(pc, true, 'var(--race)', v => `${paceStr(v)}/km`);
  const labs = [a, b].filter(Boolean).sort((p, q) => p.ly - q.ly);
  if (labs.length === 2 && labs[1].ly - labs[0].ly < 12) { const mid = (labs[0].ly + labs[1].ly) / 2; labs[0].ly = mid - 6; labs[1].ly = mid + 6; }
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lactate threshold trend: heart rate ${a ? a.label : 'n/a'}, pace ${b ? b.label : 'n/a'}">
    ${a ? a.svg : ''}${b ? b.svg : ''}
    ${labs.map(l => `<text x="${W - R + 6}" y="${Math.max(9, Math.min(H - 2, l.ly + 3.5))}" font-size="10" font-weight="700" fill="${l.color}" font-family="var(--f-mono)">${l.label}</text>`).join('')}
  </svg>`;
}

function fitnessSection() {
  const dly = M.garminDaily;
  const today = dly.length ? dly[dly.length - 1] : null;
  // VO2 max: Garmin (via Fitness Age) first, else the sheet's fitness history
  const gV = lastVal(dly, 'vo2');
  const sheetV = M.fitness.filter(f => f.vo2).slice(-1)[0];
  const vo2 = gV ? { v: gV.vo2, src: `Garmin, ${fmtShort(gV.date)}` } : sheetV ? { v: sheetV.vo2, src: `Your sheet, ${sheetV.label}` } : null;
  const vo2Hist = M.fitness.filter(f => f.vo2).map(f => f.vo2);
  const vo2Line = [...vo2Hist]; M.garminDaily.filter(r => r.vo2).forEach(r => { if (vo2Line[vo2Line.length - 1] !== r.vo2) vo2Line.push(r.vo2); });
  if (vo2 && vo2Line[vo2Line.length - 1] !== vo2.v) vo2Line.push(vo2.v);
  const lt = M.fitness.filter(f => f.ltHr || f.ltPace).slice(-1)[0];
  const ltRows = M.fitness.filter(f => f.ltPace && secs(f.ltPace) > 0), ltLine = ltRows.map(f => secs(f.ltPace)), ltFirst = ltRows[0];
  const ltGain = ltLine.length > 1 ? ltLine[0] - ltLine[ltLine.length - 1] : 0;   // seconds per km faster

  // Readiness signals
  const sig = [];
  const hrvRow = lastVal(dly, 'hrv'), rhrRow = lastVal(dly, 'rhr'), bbRow = lastVal(dly, 'bb'), slRow = lastVal(dly, 'sleep');
  let flags = 0;
  if (hrvRow) {
    const low = hrvRow.hrvLo && hrvRow.hrv < hrvRow.hrvLo, st = String(hrvRow.hrvStatus || '').toUpperCase();
    const bad = low || /LOW|POOR|UNBALANCED/.test(st);
    if (bad) flags++;
    sig.push(['HRV last night', `${Math.round(hrvRow.hrv)} ms`, hrvRow.hrvLo ? `baseline ${Math.round(hrvRow.hrvLo)}–${Math.round(hrvRow.hrvHi)}${st && st !== 'NONE' ? ' · ' + st.toLowerCase() : ''}` : (st || ''), bad ? 'warn' : 'go']);
  }
  if (rhrRow) {
    const diff = rhrRow.rhr7 ? rhrRow.rhr - rhrRow.rhr7 : 0, bad = diff >= 5;
    if (bad) flags++;
    sig.push(['Resting HR', `${Math.round(rhrRow.rhr)} bpm`, rhrRow.rhr7 ? `${diff > 0 ? '+' : ''}${Math.round(diff)} vs 7-day avg` : '', bad ? 'warn' : 'go']);
  }
  if (bbRow) { const bad = bbRow.bb < 40; if (bad) flags++; sig.push(['Body Battery at wake', `${Math.round(bbRow.bb)}`, bbRow.bb >= 70 ? 'well charged' : bbRow.bb >= 40 ? 'moderate' : 'low', bad ? 'warn' : 'go']); }
  if (slRow) { const bad = slRow.sleep < 6; if (bad) flags++; sig.push(['Sleep', `${slRow.sleep} h`, fmtShort(slRow.date), bad ? 'warn' : 'go']); }
  const verdict = !sig.length ? null : flags === 0 ? ['Ready to train', 'go'] : flags === 1 ? ['Some fatigue showing', 'amber'] : ['Go easy today', 'warn'];

  // Training load from Garmin's per-activity load
  // Training load. Garmin's own acute load isn't in its API, so Telemetry rebuilds it from each
  // activity's Garmin load: exponentially weighted like Garmin (recent days count more),
  // acute over ~7 days and chronic over ~28 days, shown as weekly totals.
  const loadByDate = {}; dly.forEach(r => { if (r.load != null) loadByDate[r.date] = r.load; });
  const sumLoad = (a, b) => { let s = 0; for (let d = a; d <= b; d = addDays(d, 1)) s += loadByDate[d] || 0; return s; };
  const firstLoadDay = Object.keys(loadByDate).sort()[0];
  const baselineDays = firstLoadDay ? daysBetween(firstLoadDay, TODAY) + 1 : 0;
  let acute = null, chronic = null, ratio = null;
  if (baselineDays >= 28) {
    const la = 2 / (7 + 1), lc = 2 / (28 + 1);
    let ea = null, ec = null;
    for (let d = firstLoadDay; d <= TODAY; d = addDays(d, 1)) {
      const v = loadByDate[d] || 0;
      ea = ea == null ? v : ea + la * (v - ea);
      ec = ec == null ? v : ec + lc * (v - ec);
    }
    acute = ea * 7; chronic = ec * 7;
    ratio = chronic > 0 ? acute / chronic : null;
  }
  const plain7 = sumLoad(addDays(TODAY, -6), TODAY);
  const band = ratio == null ? null : ratio < 0.8 ? ['Low', 'rest'] : ratio <= 1.3 ? ['Optimal', 'go'] : ratio <= 1.5 ? ['High', 'amber'] : ['Very high', 'warn'];
  const hasLoad = Object.keys(loadByDate).length > 0;

  // Race predictions
  const race = M.runs.filter(r => r.kind === 'race' && r.km >= 5 && secs(r.time)).pop();
  const dists = [['5K', 5000], ['10K', 10000], ['Half', 21097.5], ['Marathon', 42195]];
  // personal records: fastest logged run at each distance (98–106% of it), scaled to the exact distance
  const prs = dists.map(([n, m]) => {
    const fromRuns = M.runs.filter(r => r.km * 1000 >= m * 0.98 && r.km * 1000 <= m * 1.06 && secs(r.time) > 0)
      .map(r => ({ t: secs(r.time) * m / (r.km * 1000), date: r.date, src: 'whole logged run' }));
    const fromTab = M.prs.filter(p => p.dist === n && p.sec > 0).map(p => ({ t: p.sec, date: p.date, src: /^garmin/i.test(p.source) ? 'best effort in a run' : 'entered by you' }));
    return [...fromTab, ...fromRuns].sort((a, b) => a.t - b.t)[0] || null;
  });
  const hasPr = prs.some(Boolean);
  const fromVo2 = vo2 ? dists.map(([, m]) => vdotTime(vo2.v, m)) : null;

  // Weekly load (Mon–Sun), last 6 weeks, each bar labelled. Benchmark: your own optimal band,
  // 0.8–1.3 × your chronic weekly load — the same ratio Garmin's acute-load gauge is built on.
  const loadBars = (() => {
    if (!hasLoad) return '';
    const wk0 = monday(TODAY), wks = [];
    for (let i = 5; i >= 0; i--) { const s0 = addDays(wk0, -7 * i); wks.push({ s0, v: sumLoad(s0, addDays(s0, 6)), cur: i === 0 }); }
    const lo = chronic ? chronic * 0.8 : null, hi = chronic ? chronic * 1.3 : null;
    const W = 320, H = 130, L = 4, R = 4, T = 8, B = 18, bw = (W - L - R) / wks.length;
    const max = Math.max(100, hi || 0, ...wks.map(w => w.v)) * 1.15, y = v => T + (H - T - B) * (1 - v / max);
    let g = '';
    if (chronic) g += `<rect x="${L}" y="${y(hi)}" width="${W - L - R}" height="${y(lo) - y(hi)}" fill="var(--go)" opacity=".12"/>
      <line x1="${L}" x2="${W - R}" y1="${y(chronic)}" y2="${y(chronic)}" stroke="var(--go)" stroke-dasharray="3 3" stroke-width="1"/>`;
    wks.forEach((w, i) => {
      const x = L + i * bw + bw * 0.2, wd = bw * 0.6, inBand = chronic && w.v >= lo && w.v <= hi;
      const col = !chronic || (w.cur && w.v <= hi) ? 'var(--quality)' : w.v > hi ? 'var(--race)' : w.v < lo ? 'var(--rest)' : 'var(--go)';   // this week is still filling up
      g += `<rect x="${x}" y="${y(w.v)}" width="${wd}" height="${Math.max(0, y(0) - y(w.v))}" rx="3" fill="${col}" opacity="${w.cur ? .55 : 1}" data-tip="Week of ${esc(fmtShort(w.s0))}|Load ${Math.round(w.v)}${w.cur ? ' (so far)' : ''}${chronic ? `|${w.cur && w.v <= hi ? `${Math.max(0, Math.round(lo - w.v))} more to reach your range` : inBand ? 'In your optimal range' : w.v > hi ? 'Above your optimal range' : 'Below your optimal range'}` : ''}"/>
        ${y(0) - y(w.v) > 20 ? `<text x="${x + wd / 2}" y="${y(w.v) + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="var(--f-mono)">${Math.round(w.v)}</text>` : `<text x="${x + wd / 2}" y="${y(w.v) - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--f-mono)">${Math.round(w.v)}</text>`}
        <text x="${x + wd / 2}" y="${H - 5}" text-anchor="middle" font-size="9.5" fill="${w.cur ? 'var(--ink)' : 'var(--ink-3)'}" font-family="var(--f-mono)">${w.cur ? 'this wk' : esc(fmtShort(w.s0))}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="loadweeks" role="img" aria-label="Weekly training load, last 6 weeks">${g}</svg>
      ${chronic ? `<div class="legend"><span><i style="background:var(--go);opacity:.35"></i>Your optimal range ${Math.round(lo)}–${Math.round(hi)} / week</span><span><i style="background:var(--race)"></i>Above</span><span><i style="background:var(--rest)"></i>Below</span><span><i style="background:var(--quality)"></i>This week so far</span></div>` : ''}`;
  })();

  const waiting = '<p class="desc">Fills in after the Garmin sync runs.</p>';
  return `<div class="stack">
    <div class="kpis fit">
      <div class="card kpi"><span class="mono">VO2 max</span><b class="num">${vo2 ? vo2.v : '—'}</b><small>${vo2 ? esc(vo2.src) : 'Not available yet'}${vo2Line.length > 1 ? ` · ${vo2Line[vo2Line.length - 1] - vo2Line[0] >= 0 ? '+' : ''}${(vo2Line[vo2Line.length - 1] - vo2Line[0]).toFixed(1)} since ${esc(M.fitness.find(f => f.vo2) ? M.fitness.find(f => f.vo2).label : 'start')}` : ''}</small>${trendLine(vo2Line, 'var(--quality)')}</div>
      <div class="card kpi"><span class="mono">Lactate threshold</span><b class="num">${lt ? esc(lt.ltPace || '—') : '—'}<small>${lt && lt.ltPace ? ' /km' : ''}</small></b><small>${ltLine.length > 1 ? `${ltGain >= 0 ? `${Math.round(ltGain)} s/km faster` : `${Math.round(-ltGain)} s/km slower`} since ${esc(ltFirst.label)}` : 'From your sheet'}</small>${ltTrend(M.fitness)}</div>
    </div>
    <div class="card fitcard">
      <header><div><div class="mono">Readiness check</div>${verdict ? `<div class="pline"><span class="dot" style="background:var(--${verdict[1] === 'amber' ? 'long' : verdict[1]})"></span> ${verdict[0]}</div>` : '<div class="pline">Waiting for Garmin data</div>'}</div></header>
      ${sig.length ? `<ul class="load">${sig.map(([k, v, sub, c]) => `<li><span>${esc(k)}<br><small class="${c === 'warn' ? 'warn-t' : ''}">${esc(sub)}</small></span><span class="num" style="font:700 16px var(--f-display);color:var(--ink)">${esc(v)}</span></li>`).join('')}</ul>` : waiting}
      <p class="desc fine">Telemetry's own check from Garmin's HRV, resting HR, Body Battery and sleep. Garmin's Training Readiness and Training Status aren't available through its API.</p>
    </div>
    <div class="card fitcard">
      <header><div><div class="mono">Training load</div>${ratio != null ? `<div class="pline num">${Math.round(acute)} <small>acute · ratio ${ratio.toFixed(2)}</small> <span class="chip k-${band[1] === 'go' ? 'easy' : band[1] === 'amber' ? 'long' : band[1] === 'warn' ? 'race' : 'rest'}" style="margin-left:4px">${band[0]}</span></div>` : hasLoad ? `<div class="pline num">${Math.round(plain7)} <small>last 7 days</small></div>` : '<div class="pline">—</div>'}</div></header>
      ${hasLoad ? loadBars : ''}
      ${!hasLoad ? waiting : ratio != null
        ? `<p class="desc fine">Benchmark: the green band is 0.8–1.3 × your chronic load (${Math.round(chronic)} a week, your 4-week weighted average). Weeks inside it build fitness; above it (red) injury risk rises; below it (grey) fitness drifts, which is expected in recovery and taper weeks like race week. Rebuilt from each activity's Garmin load, so close to Garmin's acute load, not identical.</p>`
        : `<p class="desc fine">Building baseline: ${baselineDays} of 28 days. The ratio appears once there are 4 weeks of load history; the next Garmin sync backfills it.</p>`}
    </div>
    <div class="card fitcard">
      <header><div class="mono">Race predictions</div></header>
      <div class="tablewrap"><table class="pred"><thead><tr><th></th>${fromVo2 ? `<th>Estimate<br><small>VO2 max ${vo2.v}</small></th>` : ''}<th>My PRs</th></tr></thead>
      <tbody>${dists.map(([n], i) => `<tr><th>${n}</th>${fromVo2 ? `<td class="num">${fmtDur(fromVo2[i])}</td>` : ''}<td class="num">${prs[i] ? `${fmtDur(prs[i].t)}<small class="prdate">${prs[i].date && /^\d{4}-/.test(prs[i].date) ? `${esc(fmtShort(prs[i].date))} ${D(prs[i].date).getFullYear()} · ` : ''}${esc(prs[i].src)}</small>` : '<span class="r-sub">—</span>'}</td></tr>`).join('')}</tbody></table></div>
      <p class="desc fine">Garmin's race predictor isn't available through its API, so the estimate is Telemetry's, from your VO2 max (Daniels' VDOT tables). Heat and humidity in Bangkok usually make real times slower than the estimate. PRs are your fastest Garmin best effort at each distance (the quickest stretch of that distance inside any run), updated on every sync.</p>
    </div></div>`;
}

function fitnessSub() {
  const g = lastVal(M.garminDaily, 'vo2'), f = M.fitness.filter(x => x.vo2).slice(-1)[0];
  const v = g ? g.vo2 : f ? f.vo2 : null;
  return v ? `VO2 max ${v}` : '';
}

/* ================= Activity tab ================= */
state.act = null; state.actId = null; state.actLoading = false; state.actError = '';
state.actCache = {};
const recentRuns = a => (a && a.recent || []).filter(r => /run/i.test(r.type || '')).slice(0, 3);
async function fetchActivity(id) {
  if (id && state.actCache[id]) return state.actCache[id];
  const r = await API.call('activity', id || null);
  if (r && r.name) r.name = courseName(r.name);
  if (r && r.recent) r.recent.forEach(x => { x.name = courseName(x.name); });
  if (r && r.id) state.actCache[r.id] = r;
  return r;
}
async function loadActivity(id) {
  if (id && state.actCache[id]) { state.act = state.actCache[id]; state.actId = id; if (state.tab === 'activity') render(); return; }
  state.actLoading = true; state.actError = ''; state.actId = id || null;
  if (state.tab === 'activity') render();
  try {
    const r = await fetchActivity(id);
    if (r && r.error && !r.id) { state.actError = r.error; state.act = r; }
    else {
      if (!id || state.actId === id) state.act = r;
      // fetch the other two of the latest three runs in the background so switching is instant
      if (!state.actPrefetched) { state.actPrefetched = true; (async () => { for (const x of recentRuns(r)) { if (!state.actCache[x.id]) { try { const y = await fetchActivity(x.id); y.recent = y.recent || r.recent; } catch (e) {} } } })(); }
    }
  } catch (e) {
    state.actError = /Unknown action|Garmin|key/i.test(String(e && e.message)) ? `Garmin isn't connected yet (${e.message}). Finish the Garmin.gs setup, then reopen this tab.` : 'Could not load the activity: ' + (e && e.message ? e.message : e);
  }
  state.actLoading = false;
  if (state.tab === 'activity') render();
}

/* ---------- post-workout evaluation ---------- */
const FEEL = { 0: 'Very weak', 25: 'Weak', 50: 'Normal', 75: 'Strong', 100: 'Very strong' };
// Garmin stores RPE as 10–100 (10 = 1/10); older devices may send 1–10
const garminRpe = v => v == null || v === '' ? null : (+v > 10 ? Math.round(+v / 10) : +v);
const garminFeel = v => v == null || v === '' ? null : (FEEL[Math.round(+v / 25) * 25] || null);
/** The saved note for a Garmin activity, or for a logged session on the same day. */
function noteFor(id, date, activity) {
  const n = M.notes || [];
  return n.find(x => x.key === String(id)) || (activity && n.find(x => x.key === `${date}|${activity}`))
    || (date && n.find(x => x.date === date && /^run|social run/i.test(x.name))) || null;
}

function evalCard(a, date) {
  const n = noteFor(a.id, date) || {};
  const plan = M.plan.find(p => p.date === date && p.run) || M.history.find(h => h.date === date && h.run);
  const rpe = garminRpe(a.rpe) || (plan && plan.rpe ? +plan.rpe : null);
  const feel = garminFeel(a.feel);
  return `<form class="card evalcard" id="evalForm" data-key="${esc(a.id)}" data-date="${esc(date)}" data-name="${esc(a.name || '')}" autocomplete="off">
    <ul class="load">
      <li><span>Perceived effort</span><span class="num"><b>${rpe ? rpe + '/10' : '—'}</b>${rpe ? `<small> · ${garminRpe(a.rpe) ? 'Garmin' : 'your log'}</small>` : '<small> · not rated</small>'}</span></li>
      <li><span>Feel</span><span><b>${feel || '—'}</b>${feel ? '<small> · Garmin</small>' : ''}</span></li>
    </ul>
    <label class="f">Leg condition<input id="evLegs" maxlength="200" placeholder="e.g. Heavy after km 6" value="${esc(n.legs || '')}"></label>
    <label class="f">Race notes<textarea id="evRace" maxlength="1000" placeholder="Course, crowds, weather, fuelling, what you'd change">${esc(n.race || '')}</textarea></label>
    <div class="actions"><button class="btn" type="submit">${n.legs || n.race ? 'Update evaluation' : 'Save evaluation'}</button></div>
    <p class="desc fine">Effort and feel come from your watch's post-run prompt. Leg condition and notes are saved to the Workout Notes tab in your sheet.</p>
  </form>`;
}

// Garmin's training-effect scale (0–5)
const teWord = v => v == null ? 'not recorded' : v < 1 ? 'no benefit' : v < 2 ? 'minor' : v < 3 ? 'maintaining' : v < 4 ? 'improving' : v < 5 ? 'highly improving' : 'overreaching';

  const fmtWhen = r => { const ds = r.date.slice(0, 10); return `${ds === TODAY ? 'Today' : ds === addDays(TODAY, -1) ? 'Yesterday' : fmtDay(ds)}${r.durS ? ' · ' + hhmm(r.durS) : ''}`; };
  const opts = (a.recent || []).filter(r => !top3Ids.has(r.id)).map(r => `<option value="${esc(r.id)}" ${r.id === a.id ? 'selected' : ''}>${esc(r.date.slice(5, 10).replace('-', '/'))} · ${esc(r.name || r.type)}${r.km ? ` · ${km1(r.km)} km` : ''}</option>`).join('');

        <div style="min-width:0"><div class="mono">${i === 0 ? 'Latest run · ' : ''}${esc(fmtWhen(r))}</div><div class="pline one">${esc(r.name || 'Run')}</div></div>
        <span class="pside num">${r.km ? km1(r.km) + ' km' : ''}${state.actLoading && state.actId === r.id ? ' · loading' : ''}</span></button>`).join('')}</div>` : ''}
    ${opts ? `<label class="f" style="margin:0 0 10px">Older activities<select id="actPick"><option value="">Choose…</option>${opts}</select></label>` : ''}

    <div class="card act-head">

      <h3>${esc(a.name || 'Activity')}</h3>

        <div><b class="num">${wPace ? paceStr(wPace) : '—'}</b><small>/km${W ? ' workout' : ''}</small></div>
        <div><b class="num">${wHr ? Math.round(wHr) : '—'}</b><small>${W ? 'bpm workout' : 'avg bpm'}</small></div>
      </div>
    ${W ? `<div class="phasebar">${a.phases.map(p => `<span class="ph ph-${p.kind}" style="flex:${p.timeS}"><b>${{ warmup: 'Warm-up', workout: 'Workout', cooldown: 'Cool-down' }[p.kind]}</b> ${km1(p.distM / 1000)} km · ${p.paceS ? paceStr(p.paceS) : '—'}</span>`).join('')}</div>

    </div>

    ${fold('a-stats', 'Statistics', `<div class="card metrics">

      ${a.gctBalance ? metric('GCT balance', a.gctBalance.toFixed(1) + '%', 'left') : ''}
      ${(W ? W.vo : avgVo) ? metric('Vert. osc.', (W ? W.vo : avgVo).toFixed(1), 'cm') : ''}
      ${a.vertRatio ? metric('Vert. ratio', a.vertRatio.toFixed(1) + '%', 'lower = efficient') : ''}

      ${a.steps ? metric('Steps', Math.round(a.steps).toLocaleString(), 'steps') : ''}
      ${metric('Aerobic TE', a.te ? a.te.toFixed(1) : '—', teWord(a.te))}
      ${metric('Anaerobic TE', a.ate != null ? a.ate.toFixed(1) : '—', teWord(a.ate))}
      ${metric('Load', a.load ? Math.round(a.load) : '—', 'Garmin load')}
      ${a.bodyBattery != null ? metric('Body Battery', (a.bodyBattery > 0 ? '+' : '') + Math.round(a.bodyBattery), 'impact') : ''}
      ${a.vigorousMin != null || a.moderateMin != null ? metric('Intensity min', Math.round((a.vigorousMin || 0) * 2 + (a.moderateMin || 0)), `${Math.round(a.vigorousMin || 0)} vigorous ×2`) : ''}
      ${a.respiration ? metric('Breathing', Math.round(a.respiration), 'brpm avg') : ''}
      ${a.sweatMl ? metric('Sweat loss', Math.round(a.sweatMl), 'ml est.') : ''}
      ${metric('Elevation', a.elevGain != null ? '+' + Math.round(a.elevGain) : '—', a.elevLoss != null ? `−${Math.round(a.elevLoss)} m` : 'm')}
      ${metric('Calories', a.calories ? Math.round(a.calories) : '—', 'kcal')}
    </div>`, `${km1(km)} km · ${a.load ? Math.round(a.load) + ' load' : ''}`)}
    ${z && zTot ? fold('a-zones', 'Heart-rate zones', `<div class="card chart"><p class="desc" style="margin:0">Total ${fmtDur(zTot)}</p>
      <div class="zones">${[5, 4, 3, 2, 1].map(i => { const v = z.secs[i], lo = z.floors[i - 1], hi = i < 5 ? z.floors[i] - 1 : z.max; return `<div class="zrow"><span class="zl">Zone ${i}<small>${['', 'Warm up', 'Easy', 'Aerobic', 'Threshold', 'Maximum'][i]} · ${lo}–${hi || ''}</small></span><span class="zbar"><i style="width:${zTot ? v / zTot * 100 : 0}%;background:${zoneColors[i]}"></i></span><span class="zv num">${fmtDur(v)}<small>${Math.round(v / zTot * 100)}%</small></span></div>`; }).join('')}${[[0, 'Below zone 1', z.secs[0]], [6, 'No HR signal', z.noHrS || 0]].filter(r => r[2] >= 1).map(([, n, v]) => `<div class="zrow"><span class="zl" style="font-size:13px;color:var(--ink-2)">${n}</span><span class="zbar"><i style="width:${v / zTot * 100}%;background:var(--ink-3)"></i></span><span class="zv num">${fmtDur(v)}<small>${Math.round(v / zTot * 100)}%</small></span></div>`).join('')}</div></div>`, (() => { const top = [1, 2, 3, 4, 5].reduce((m, i) => z.secs[i] > z.secs[m] ? i : m, 1); return `mostly zone ${top} · ${Math.round(z.secs[top] / zTot * 100)}%`; })()) : ''}

        return groups.map(g => !g.p ? g.rows.map(r => row(r)).join('') :
          `<tr class="grp grp-${g.p.kind}"><td colspan="7"><b>${{ warmup: 'Warm-up', workout: 'Workout', cooldown: 'Cool-down' }[g.p.kind]}</b> <span>${km1(g.p.distM / 1000)} km · ${fmtDur(g.p.timeS)} · ${g.p.paceS ? paceStr(g.p.paceS) : '—'}/km · ${g.p.hr ? Math.round(g.p.hr) + ' bpm' : ''}</span></td></tr>` +
          g.rows.map(r => row(r, g.p.kind === 'workout' ? '' : 'dim')).join('')).join('');
      })()}
      </tbody><tfoot><tr><td>Total</td><td class="num">${fmtDur(a.splits.reduce((s, x) => s + x.timeS, 0))}</td><td class="num">${pace ? paceStr(pace) : '—'}</td><td class="num">${avgHr ? Math.round(avgHr) : '—'}</td><td class="num">${avgCad ? Math.round(avgCad) : '—'}</td><td class="num">${avgGct ? Math.round(avgGct) : '—'}</td><td class="num">${avgStep ? avgStep.toFixed(2) : '—'}</td></tr></tfoot></table></div>
      <p class="desc fine">All times use the watch's timer time (pauses excluded), so splits, zones and run/walk add up to ${fmtDur(timeS)}. Total row is the whole run; ${W ? 'header, cards and chart averages are the workout block only (time-weighted).' : 'averages are time-weighted.'}</p></div>`, `${a.splits.length} splits${W ? ' · warm-up, workout, cool-down' : ''}`) : a.fitError ? `<div class="card empty">${esc(a.fitError)}</div>` : ''}

/* Stacked charts over the course of a run, sharing one distance axis.
   trace rows: [distance m, pace s/km, HR, cadence spm, stride m, GCT ms, state R/W/S, elapsed s] */
function runCharts(a, rw, rwTot) {
  // Runs are plotted against distance; everything else (tennis, badminton…) against time,
  // because you barely cover ground on a court and a distance axis squashes it into gaps.
  const isRun = /run/i.test(a.type || '');
  const X = p => isRun ? p[0] : p[7];
  const tr = (a.trace || []).filter(p => X(p) != null);
  if (tr.length < 3) return '<div class="empty">No samples recorded for this activity.</div>';
  const maxD = X(tr[tr.length - 1]) || 1, W = 340, L = 36, R = 6, H = 92, T = 8, B = 8;
  const x = d => L + (W - L - R) * d / maxD;

  // walking / standing stretches, shaded on every chart
  const bands = [];
  let open = null;
  if (isRun) tr.forEach((p, i) => {
    const off = p[6] && p[6] !== 'R';
    if (off && !open) open = { a: i ? tr[i - 1][0] : p[0], s: p[6] };
    if (!off && open) { bands.push({ a: open.a, b: p[0] }); open = null; }
  });
  if (open) bands.push({ a: open.a, b: maxD });
  const bandSvg = bands.map(b => `<rect x="${x(b.a)}" y="0" width="${Math.max(1.5, x(b.b) - x(b.a))}" height="${H}" fill="var(--long)" opacity=".14"/>`).join('');

  const pct = (arr, q) => { const s = [...arr].sort((m, n) => m - n); return s[Math.min(s.length - 1, Math.max(0, Math.round((s.length - 1) * q)))]; };
  const allMetrics = [
    { k: 1, name: 'Pace', unit: '/km', color: 'var(--quality)', fmt: v => paceStr(v), invert: true, ok: v => v > 120 && v < 1500 },
    { k: 2, name: 'Heart rate', unit: 'bpm', color: 'var(--race)', fmt: v => Math.round(v) },
    { k: 3, name: 'Cadence', unit: 'spm', color: 'var(--easy)', fmt: v => Math.round(v) },
    { k: 4, name: 'Stride', unit: 'm', color: 'var(--strength)', fmt: v => v.toFixed(2) },
    { k: 5, name: 'Ground contact', unit: 'ms', color: 'var(--long)', fmt: v => Math.round(v) }
  ];
  const metrics = isRun ? allMetrics : allMetrics.filter(m => m.k === 2);   // pace, cadence and form mean little on a court

  // shared tap targets: one column every ~2.5% of the run, showing every metric at that point
  const cols = 40, colW = (W - L - R) / cols;
  const tipAt = d => {
    let best = tr[0]; for (const p of tr) { if (Math.abs(X(p) - d) < Math.abs(X(best) - d)) best = p; }
    if (!isRun) return [`${fmtDur(best[7] || 0)} in`, `HR ${best[2] || '—'} bpm`].join('|');
    const st = best[6] === 'W' ? ' · walking' : best[6] === 'S' ? ' · stopped' : '';
    return [`${(best[0] / 1000).toFixed(2)} km · ${fmtDur(best[7] || 0)}${st}`,
      `Pace ${best[1] && best[1] < 1500 ? paceStr(best[1]) : '—'} · HR ${best[2] || '—'}`,
      `Cadence ${best[3] || '—'} · Stride ${best[4] != null ? best[4].toFixed(2) + ' m' : '—'}`,
      best[5] ? `GCT ${best[5]} ms` : ''].filter(Boolean).join('|');
  };
  const hits = Array.from({ length: cols }, (_, i) => { const d = (i + 0.5) / cols * maxD; return `<rect class="hit" x="${L + i * colW}" y="0" width="${colW}" height="${H}" fill="transparent" data-tip="${esc(tipAt(d))}"/>`; }).join('');

  const phaseSvg = (isRun && a.phases && a.phases.length > 1 ? a.phases.filter(p => p.kind !== 'workout') : []).map(p => `<rect x="${x(p.d0)}" y="0" width="${Math.max(1, x(p.d0 + p.distM) - x(p.d0))}" height="${H}" fill="url(#wucd)"/>`).join('');
  const kmStepC = maxD > 15000 ? 5 : maxD > 6000 ? 2 : 1;
  const unitX = isRun ? 1000 : 60 * (maxD > 5400 ? 30 : maxD > 1800 ? 15 : 10), stepX = isRun ? kmStepC : 1;   // km, or 10/15/30-minute marks
  let xTicks = '';
  for (let k = stepX; k * unitX < maxD - unitX * 0.3; k += stepX) xTicks += `<line x1="${x(k * unitX)}" x2="${x(k * unitX)}" y1="${H - 4}" y2="${H}" stroke="var(--ink-3)" stroke-width="1"/>`;
  const charts = metrics.map(m => {
    const pts = tr.filter(p => p[m.k] != null && (!m.ok || m.ok(p[m.k])));
    if (pts.length < 3) return '';
    const runVals = pts.filter(p => p[6] === 'R' || !p[6]).map(p => p[m.k]);
    const all = pts.map(p => p[m.k]);
    let lo = pct(all, 0.03), hi = pct(all, 0.97);
    const tg = (isRun ? a.targets || [] : []).filter(t => (m.k === 1 && t.kind === 'pace') || (m.k === 2 && t.kind === 'hr'));
    tg.forEach(t => { lo = Math.min(lo, t.lo); hi = Math.max(hi, t.hi); });   // keep the whole target band on the chart
    if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
    const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
    const clamp = v => Math.max(lo, Math.min(hi, v));
    const y = v => m.invert ? T + (H - T - B) * (clamp(v) - lo) / (hi - lo) : T + (H - T - B) * (1 - (clamp(v) - lo) / (hi - lo));
    const avg = (a._avg && a._avg[m.k]) || all.reduce((s, v) => s + v, 0) / all.length;   // same average as the cards
    let d = '', on = false, prev = null;
    tr.forEach(p => {
      const v = p[m.k], good = v != null && (!m.ok || m.ok(v));
      // runs break the line across pauses; other sports join every sample into one line
      if (good) { d += `${prev != null && (!isRun || (on && X(p) - prev < maxD / 30)) ? 'L' : 'M'}${x(X(p)).toFixed(1)},${y(v).toFixed(1)}`; on = true; prev = X(p); } else on = false;
    });
    const fast = m.invert ? Math.min(...all) : Math.max(...all);
    return `<div class="rc">
      <div class="rc-h"><span class="rc-n"><i style="background:${m.color}"></i>${m.name}</span><span class="num">${a._avgLabel || 'avg'} <b>${m.fmt(avg)}</b> ${m.unit}<small> · ${tg.length ? `target ${tg.length === 1 ? `${m.fmt(tg[0].lo)}–${m.fmt(tg[0].hi)}` : 'varies'}` : `${m.invert ? 'best' : 'max'} ${m.fmt(fast)}`}</small></span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.name} over the run, average ${m.fmt(avg)} ${m.unit}">
        <defs><pattern id="wucd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--bg)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-3)" stroke-width="1.2" opacity=".22"/></pattern></defs>
        <rect x="${L}" y="0" width="${W - L - R}" height="${H}" rx="4" fill="var(--bg)" opacity=".6"/>
        ${phaseSvg}
        ${bandSvg}
        ${tg.map(t => { const top = Math.min(y(t.lo), y(t.hi)), bot = Math.max(y(t.lo), y(t.hi)), x0 = x(t.d0), w = Math.max(1, x(t.d1) - x(t.d0));
          return `<g><title>Target ${m.fmt(t.lo)}–${m.fmt(t.hi)} ${m.unit}</title>
            <rect x="${x0}" y="${top}" width="${w}" height="${H - top}" fill="var(--ink-3)" opacity=".30"/>
            <line x1="${x0}" x2="${x0 + w}" y1="${top}" y2="${top}" stroke="var(--ink-3)" stroke-width="1" opacity=".7"/></g>`; }).join('')}
        ${[hi - padv, (lo + hi) / 2, lo + padv].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${m.fmt(v)}</text>`).join('')}
        <line x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}" stroke="${m.color}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
        <path d="${d}" fill="none" stroke="${m.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        ${xTicks}
        ${hits}
      </svg></div>`;
  }).join('');

  if (!isRun) {
    let tl = ''; for (let k = 0; k * unitX <= maxD; k++) tl += `<text x="${Math.min(W - R - 6, x(k * unitX))}" y="11" text-anchor="${k === 0 ? 'start' : 'middle'}" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${k * unitX / 60}${k === 0 ? ' min' : ''}</text>`;
    return `${charts}<svg viewBox="0 0 ${W} 14" class="rcaxis" aria-hidden="true">${tl}</svg>
      <p class="desc fine" style="margin-top:4px">Plotted over time. Tap the chart to read heart rate at that point.</p>`;
  }
  // run / walk strip on the same axis
  let strip = '';
  for (let i = 1; i < tr.length; i++) {
    const s = tr[i][6] || 'R', c = s === 'W' ? 'var(--long)' : s === 'S' ? 'var(--rest)' : 'var(--easy)';
    strip += `<rect x="${x(tr[i - 1][0])}" y="0" width="${Math.max(0.6, x(tr[i][0]) - x(tr[i - 1][0]) + 0.4)}" height="14" fill="${c}"/>`;
  }
  const kmStep = maxD > 15000 ? 5 : maxD > 6000 ? 2 : 1;
  let ticks = '';
  for (let k = 0; k * 1000 <= maxD; k += kmStep) ticks += `<text x="${Math.min(W - R - 6, x(k * 1000))}" y="11" text-anchor="${k === 0 ? 'start' : 'middle'}" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${k}${k === 0 ? ' km' : ''}</text>`;

  const legend = rw && rwTot ? [['Run', rw.runS, 'var(--easy)'], ['Walk', rw.walkS, 'var(--long)'], ['Stand', rw.standS, 'var(--rest)']].filter(r => r[1] > 0)
    .map(([n, v, c]) => `<span><i style="background:${c}"></i>${n} ${fmtDur(v)} · ${Math.round(v / rwTot * 100)}%</span>`).join('') : '';

  return `${charts}
    <div class="rc">
      <div class="rc-h"><span class="rc-n"><i style="background:var(--easy)"></i>Run / walk${rw && !rw.garmin ? ' <small>(from pace)</small>' : ''}</span></div>
      <svg viewBox="0 0 ${W} 30" class="rwstrip" role="img" aria-label="Running and walking over the run">
        <text x="${L - 5}" y="11" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">R/W</text>
        <g>${strip}</g>
        <g transform="translate(0,16)">${ticks}</g></svg>
      ${legend ? `<div class="legend" style="margin-top:2px">${legend}</div>` : ''}
    </div>
    <p class="desc fine" style="margin-top:4px">${a.phases && a.phases.length > 1 ? 'Striped ends = warm-up and cool-down; amber = walking or stopped.' : 'Shaded stretches are walking or stopped.'}${(a.targets || []).length ? ' Grey area under the line = your workout target, as on Garmin.' : ''} Tap any chart to read every metric at that point.</p>`;
}

function actTrace(a) {
  const tr = (a.trace || []).filter(p => p[0] != null);
  if (tr.length < 3) return '<div class="empty">No pace/HR samples.</div>';
  const W = 340, H = 170, L = 34, R = 30, T = 10, B = 22;
  const maxD = tr[tr.length - 1][0] || 1;
  const pv = tr.map(p => p[1]).filter(v => v && v < 1200);
  const hv = tr.map(p => p[2]).filter(Boolean);
  const pMin = Math.floor(Math.min(...pv) / 30) * 30, pMax = Math.ceil(Math.max(...pv) / 30) * 30 || pMin + 60;
  const hMin = Math.floor(Math.min(...hv) / 10) * 10, hMax = Math.ceil(Math.max(...hv) / 10) * 10 || hMin + 20;
  const x = d => L + (W - L - R) * d / maxD, yp = v => T + (H - T - B) * (v - pMin) / (pMax - pMin || 1), yh = v => T + (H - T - B) * (1 - (v - hMin) / (hMax - hMin || 1));
  let g = '';
  for (let i = 0; i <= 3; i++) { const pV = pMin + (pMax - pMin) * i / 3, hV = hMax - (hMax - hMin) * i / 3, yy = yp(pV);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 4}" y="${yy + 3.5}" text-anchor="end" font-size="9.5" fill="var(--quality)" font-family="var(--f-mono)">${paceStr(pV)}</text><text x="${W - R + 4}" y="${yy + 3.5}" font-size="9.5" fill="var(--race)" font-family="var(--f-mono)">${Math.round(hV)}</text>`; }
  const path = (key, f) => { let s = '', on = false; tr.forEach(p => { const v = p[key]; if (v && (key !== 1 || v < 1200)) { s += `${on ? 'L' : 'M'}${x(p[0]).toFixed(1)},${f(v).toFixed(1)}`; on = true; } else on = false; }); return s; };
  g += `<path d="${path(1, yp)}" fill="none" stroke="var(--quality)" stroke-width="1.8" stroke-linejoin="round"/><path d="${path(2, yh)}" fill="none" stroke="var(--race)" stroke-width="1.8" stroke-linejoin="round"/>`;
  const kmStep = maxD > 15000 ? 5 : maxD > 6000 ? 2 : 1;
  for (let k = 0; k * 1000 <= maxD; k += kmStep) g += `<text x="${x(k * 1000)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--f-mono)">${k}${k === 0 ? ' km' : ''}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace and heart rate over distance">${g}</svg>`;
}

/* ---------- long-run fuelling ----------
 * General endurance guidance: under ~60 min no carbs needed; 60–90 min ~30 g/h;
 * 90–150 min 30–60 g/h; longer 60–90 g/h. Fluids ~400–800 ml/h, sodium ~300–600 mg/h,
 * upper end in heat. Duration comes from planned km × your recent long-run pace.
 */
let GEL_G = 25;
try { const g = +localStorage.getItem('telemetry.gelG'); if (g > 0) GEL_G = g; } catch (e) {}
function longPace() {
  const ls = M.runs.filter(r => r.kind === 'long' && r.paceSec > 0).slice(-3);
  return ls.length ? ls.reduce((s, r) => s + r.paceSec, 0) / ls.length : 435;
}
function fuelPlan(km, race) {
  let pace = longPace();
  if (race) { // predict race pace from your latest race result (Riegel), else a bit quicker than long-run pace
    const pr = M.runs.filter(r => r.kind === 'race' && r.km >= 5 && secs(r.time)).pop();
    pace = pr ? secs(pr.time) * Math.pow(km / pr.km, 1.06) / km : pace * 0.93;
  }
  const dur = km * pace, min = dur / 60;
  const rate = min < 60 ? 0 : min < 90 ? 30 : min < 150 ? (race ? 60 : 45) : 70;
  const times = [];
  if (rate) { const every = Math.max(15, Math.round(GEL_G / rate * 60 / 5) * 5); for (let t = 40; t <= min - 12; t += every) times.push(t); }
  return { km, pace, dur, rate, times, gels: times.length, carbs: times.length * GEL_G,
    fluidL: Math.round(min / 60 * 0.65 * 10) / 10, sodium: Math.round(min / 60 * 550 / 50) * 50 };
}
const fmtMin = m => `${Math.floor(m / 60)}:${pad(Math.round(m % 60))}`;

function openFuel(p) {
  const race = p.kind === 'race';
  const km = p.planned || p.km || 0;
  const f = fuelPlan(km, race);
  sheetCtx = { fuel: p };
  $('#sheetRoot').innerHTML = `<div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in">
    <div class="mono">${esc(fmtDay(p.date))} · fuel plan</div>
    <h3 id="sheetTitle">${esc(p.title)}, ${km1(km)} km</h3>
    <p class="desc">About ${fmtMin(f.dur / 60)} at ${paceStr(f.pace)}/km${race ? ' (race effort, predicted from your latest race)' : ', your recent long-run pace'}.</p>
    ${factGrid([['Carbs per hour', f.rate ? `${f.rate} g` : 'Not needed'], ['Gels', f.gels ? `${f.gels} × ${GEL_G} g` : 'None'], ['Fluid', `≈ ${f.fluidL} L total`], ['Sodium', `≈ ${f.sodium} mg total`]])}
    <ol class="fuel">
      <li><b>Night before</b><span>Normal carb-rich dinner (rice, noodles, potatoes). Nothing new.</span></li>
      <li><b>2–3 h before</b><span>Easy carbs and a little protein: toast or rice with banana, plus 400–500 ml water.</span></li>
      <li><b>15 min before</b><span>A few sips of water or electrolyte drink.</span></li>
      ${f.times.map((t, i) => `<li><b class="num">${fmtMin(t)}</b><span>Gel ${i + 1} of ${f.gels} with 150–200 ml water</span></li>`).join('')}
      <li><b>Throughout</b><span>Drink ~150–200 ml every 15–20 min. In Bangkok heat, add electrolytes and aim for the upper end.</span></li>
      <li><b>Within 60 min after</b><span>Carbs plus 20–30 g protein: rice with chicken, or chocolate milk and a banana.</span></li>
    </ol>
    <label class="f">Carbs per gel (g)<input id="gelG" class="num" inputmode="numeric" value="${GEL_G}"></label>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Close</button>
      ${f.gels ? `<button type="button" class="btn" id="logFuel" data-date="${p.date}" data-gels="${f.gels}">Log ${f.gels} gels as run fuel</button>` : ''}
    </div>
    <p class="desc" style="font-size:12.5px">General guidance for endurance runs. Practise race-day fuel on long runs first, and adjust to how your stomach handles it.</p>
  </div></div>`;
}

function openDetail(h) {
  sheetCtx = { detail: h };
  const planRow = M.plan.find(p => p.date === h.date && p.activity === h.activity) || M.plan.find(p => p.date === h.date && p.done && p.kind === h.kind);
  $('#sheetRoot').innerHTML = `<div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in">
    <div class="mono">${esc(fmtDay(h.date))} · ${esc(h.src)}</div>
    <h3 id="sheetTitle">${esc(h.type || prettyTitle(h.activity))}</h3>
    <div class="desc">${esc(h.activity)}${h.kind ? ` · ${esc(KIND_LABEL[h.kind] || '')}` : ''}</div>
    ${factGrid([
      ['Distance', h.km ? `${km1(h.km)} km` : ''], ['Time', h.time], ['Pace', h.paceSec ? `${paceStr(h.paceSec)} /km` : (h.pace || '')],
      ['Avg HR', h.hr ? `${Math.round(h.hr)} bpm` : ''], ['Perceived effort', h.rpe ? `${h.rpe} / 10` : ''], ['Training load', h.load ? Math.round(h.load) : ''],
      ['Sleep', h.sleep ? `${h.sleep} h` : ''], ['Shoes', h.shoes], ['Strides', h.strides], ['Planned', h.planned ? `${km1(h.planned)} km` : '']
    ])}
    ${h.notes ? `<p class="note-full">${linkify(h.notes)}</p>` : '<p class="desc">No notes.</p>'}
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Close</button>
      <button type="button" class="btn" id="editHist" data-plan="${planRow ? planRow.row : ''}">Edit</button>
    </div>
  </div></div>`;
}

function openRace(r) {
  const left = r.date ? daysBetween(TODAY, r.date) : null;
  const plan = r.date ? M.plan.find(p => p.date === r.date) : null;
  const done = r.date ? M.runs.find(x => x.date === r.date && x.kind === 'race') : null;
  sheetCtx = { race: r };
  $('#sheetRoot').innerHTML = `<div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in">
    <div class="mono">${r.goal ? 'Goal race' : esc(r.status || 'Race')}</div>
    <h3 id="sheetTitle">${esc(r.name)}</h3>
    ${factGrid([
      ['Date', r.date ? fmtDay(r.date) + ' ' + D(r.date).getFullYear() : 'To confirm'], ['Distance', r.dist ? `${km1(r.dist)} km` : ''],
      ['Countdown', left === null ? '' : left > 0 ? `${left} days (${Math.floor(left / 7)} wk ${left % 7} d)` : left === 0 ? 'Today' : `${-left} days ago`],
      ['Status', r.status], ['Result', done ? `${done.time} · ${paceStr(done.paceSec)}/km` : ''], ['In the plan', plan ? plan.title : '']
    ])}
    ${r.notes ? `<p class="note-full">${linkify(r.notes)}</p>` : ''}
    <div class="actions"><button type="button" class="btn ghost" data-close>Close</button></div>
  </div></div>`;
}

/* tooltips: tap (phone) or hover (desktop) on anything with data-tip */
let tipEl = null;
function showTip(target, x, y) {
  hideTip();
  const parts = target.getAttribute('data-tip').split('|');
  tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip');
  tipEl.innerHTML = `<b>${esc(parts[0])}</b>${parts.slice(1).map(esc).join('<br>')}`;
  document.body.appendChild(tipEl);
  const r = tipEl.getBoundingClientRect();
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px';
  tipEl.style.top = Math.max(8, y - r.height - 14) + 'px';
}
function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t && matchMedia('(hover: hover)').matches) { const b = t.getBoundingClientRect(); showTip(t, b.left + b.width / 2, b.top); } });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]') && matchMedia('(hover: hover)').matches) hideTip(); });
document.addEventListener('scroll', hideTip, { passive: true });

function closeSheet() { $('#sheetRoot').innerHTML = ''; sheetCtx = null; }

/* ================= actions ================= */
async function syncGarminNow() {
  setSync('busy', 'Syncing');
  try {
    const r = await API.call('syncGarmin');
    if (r && r.data) { RAW = r.data; M = build(RAW); render(); }
    setSync('', IS_PREVIEW ? 'Preview' : 'Synced');
    const n = (r.added || []).length;
    toast(r.errors && r.errors.length && !n ? r.errors[0] : `${n ? `${n} new activit${n === 1 ? 'y' : 'ies'} from Garmin` : 'Already up to date'}${r.sleepFilled ? `, sleep on ${r.sleepFilled} days` : ''}`);
  } catch (e) {
    setSync('err', 'Not synced');
    toast('Garmin sync failed: ' + (e && e.message ? e.message : e));
  }
}

let toastT;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

async function run(fn, arg, okMsg) {
  setSync('busy', 'Saving');
  try {
    const res = await API.call(fn, arg);
    if (res && res.data) { RAW = res.data; M = build(RAW); render(); }
    setSync('', IS_PREVIEW ? 'Preview' : 'Synced');
    if (okMsg) toast(okMsg);
  } catch (e) {
    setSync('err', 'Not saved');
    toast('Could not save to the sheet: ' + (e && e.message ? e.message : e) + '. Try again.');
  }
}

document.addEventListener('click', e => {
  const tipT = e.target.closest('[data-tip]');
  if (tipT) { const b = tipT.getBoundingClientRect(); showTip(tipT, b.left + b.width / 2, b.top); return; }
  hideTip();
  const hr = e.target.closest('[data-hist]');
  if (hr) { const h = M.history[+hr.dataset.hist]; if (h) openDetail(h); return; }
  const t = e.target.closest('button, .scrim');
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; try { localStorage.setItem('telemetry.tab', state.tab); } catch (_) {} render(); window.scrollTo(0, 0); return; }
  if (t.dataset.fuel) { const p = M.plan.find(x => String(x.row) === t.dataset.fuel); if (p) openFuel(p); return; }
  if (t.id === 'logFuel') { const n = +t.dataset.gels; closeSheet(); run('addMeal', { date: t.dataset.date, meal: 'Run fuel', item: `${n} gels (${n * GEL_G} g carbs)`, kcal: n * GEL_G * 4 }, 'Run fuel logged'); return; }
  if (t.id === 'garminBtn') { syncGarminNow(); return; }
  if (t.dataset.strength) { openLog({ date: t.dataset.strength, activity: 'Strength: Push', type: '', title: 'Strength', run: false, preferS2: true }); return; }
  if (t.dataset.act) { loadActivity(t.dataset.act); return; }
  if (t.id === 'actReload') { state.act = null; loadActivity(state.actId); return; }
  if (t.id === 'aiRefresh') { loadAiSummary(true); return; }
  if (t.id === 'planApply') { applyPlanChanges(); return; }
  if (t.id === 'planCancel') { state.ask.applyState = 'cancelled'; render(); return; }
  if (t.id === 'aiMore') { state.ai.more = !state.ai.more; render(); return; }
  if (t.id === 'editProfile') { const f = $('#profileForm'); if (f) f.hidden = !f.hidden; return; }
  if (t.id === 'calEarlier') { state.calEarlier = !state.calEarlier; render(); return; }
  if (t.dataset.race) { const r = M.races[+t.dataset.race]; if (r) openRace(r); return; }
  if (t.id === 'editHist' && sheetCtx && sheetCtx.detail) { const h = sheetCtx.detail, p = M.plan.find(x => String(x.row) === t.dataset.plan); openLog({ ...h, ...(p ? { logRow: p.row, week: p.week, planned: p.planned } : {}), activity: h.activity, title: h.type || prettyTitle(h.activity), done: true }); return; }
  if (t.dataset.week) { state.week = +t.dataset.week; render(); return; }
  if (t.dataset.mode) { state.trainMode = t.dataset.mode; try { localStorage.setItem('telemetry.trainMode', t.dataset.mode); } catch (_) {} render(); return; }
  if (t.id === 'fReset') { state.filter = { view: 'program', type: 'all', from: '', to: '' }; saveFilter(); render(); return; }
  if (t.dataset.log) { const p = M.plan.find(x => String(x.row) === t.dataset.log); if (p) openLog({ ...p, logRow: p.row }); return; }
  if (t.dataset.logdate) { openLog({ date: t.dataset.logdate, activity: 'Run: Easy', type: 'Easy Run', title: 'Log a session' }); return; }
  if (t.dataset.cal) { const [y, m] = state.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + Number(t.dataset.cal), 1); state.calMonth = iso(d).slice(0, 7); render(); return; }
  if (t.dataset.day) { openDay(t.dataset.day); return; }
  if (t.dataset.meal) { mealDraft.meal = t.dataset.meal; document.querySelectorAll('[data-meal]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (t.dataset.delmeal) { run('deleteMeal', t.dataset.delmeal, 'Removed'); return; }
  if (t.dataset.rpe) { sheetCtx.rpeSel = sheetCtx.rpeSel === t.dataset.rpe ? '' : t.dataset.rpe; document.querySelectorAll('[data-rpe]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rpe === sheetCtx.rpeSel))); return; }
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.id === 'clearBtn' && sheetCtx) { const c = sheetCtx; closeSheet(); run('clearSession', { logRow: c.logRow, date: c.date, activity: c.activity }, 'Cleared'); return; }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'logForm' && sheetCtx) {
    const v = id => $('#' + id).value.trim();
    const p = { logRow: sheetCtx.logRow || null, preferS2: !!sheetCtx.preferS2 || /^strength/i.test(v('fAct')), date: sheetCtx.date, activity: v('fAct'), prevActivity: sheetCtx.activity, type: v('fType'),
      km: v('fKm'), time: v('fTime'), hr: v('fHr'), rpe: sheetCtx.rpeSel, sleep: v('fSleep'), strides: v('fStrides'), shoes: v('fShoes'), notes: v('fNotes'), legs: v('fLegs'), raceNotes: v('fRace') };
    if (!p.km && !p.time) { toast('Add a distance or a time so the session counts as done.'); return; }
    if (p.time && !/^\d{1,2}:\d{2}(:\d{2})?$/.test(p.time)) { toast('Time needs h:mm:ss, for example 0:45:00.'); return; }
    if (p.time && p.time.split(':').length === 2) p.time = '0:' + p.time;
    closeSheet();
    run('saveSession', p, 'Saved to your sheet');
  }
  if (e.target.id === 'askForm') {
    const q = $('#askQ').value.trim(); if (!q || state.ask.loading) return;
    $('#askQ').value = '';
    state.ask = { q, loading: true, answer: '', error: '', changes: [], applyState: '' }; render();
    const act = (state.actCache && Object.values(state.actCache).find(activityInMyDay)) || state.act || null;
    const an = act && act.id ? (noteFor(act.id, String(act.start).slice(0, 10)) || {}) : {};
    API.call('aiAsk', { question: q, context: aiContext({ latestActivity: act && act.id ? compactActivity(act) : null,
      latestActivitySelfEvaluation: act && act.id ? { legCondition: an.legs || null, notes: an.race || null, garminRpe: garminRpe(act.rpe), garminFeel: garminFeel(act.feel) } : null, recentNotes: M.notes.slice(-6).map(n => ({ date: n.date, legs: n.legs, notes: String(n.race).slice(0, 200) })), personalRecords: M.prs.map(p => ({ distance: p.dist, time: fmtDur(p.sec) })), planEditing: planEditingContext() }) })
      .then(r => {
        state.ask.answer = r.answer;
        // keep only changes to rows we offered, and remember what each row held so the sheet can check it hasn't moved on
        state.ask.changes = (r.changes || []).map(c => { const p = M.plan.find(x => x.row === +c.row && !x.done); return p ? { ...c, row: p.row, expectDate: p.date, expectActivity: p.activity } : null; }).filter(Boolean);
      }).catch(err => { state.ask.error = String(err && err.message || err); })
      .finally(() => { state.ask.loading = false; render(); });
    return;
  }
  if (e.target.id === 'prForm') {
    let t = $('#prTime').value.trim();
    if (!/^\d{1,2}:\d{2}(:\d{2})?$/.test(t)) { toast('Time should look like 24:24 or 1:52:10.'); return; }
    if (t.split(':').length === 2) t = '0:' + t;
    run('savePr', { dist: $('#prDist').value, time: t, date: $('#prDate').value || TODAY, source: 'Manual' }, 'PR saved');
    return;
  }
  if (e.target.id === 'profileForm') {
    const h = num($('#pHeight').value), tk = num($('#pTarget').value), age = $('#pAge').value.trim(), sex = $('#pSex').value;
    const ds = +$('#pDayStart').value, tz = $('#pTz').value.trim() || 'Asia/Bangkok';
    if (!(h > 120 && h < 230) || !(tk > 30 && tk < 200)) { toast('Check height (cm) and target weight (kg).'); return; }
    try { new Intl.DateTimeFormat('en', { timeZone: tz }); } catch (_) { toast('Time zone should look like Asia/Bangkok.'); return; }
    run('saveProfile', { heightCm: h, targetKg: tk, age: age ? num(age) : '', sex, dayStartHour: ds, timezone: tz }, 'Profile saved');
    return;
  }
  if (e.target.id === 'evalForm') {
    const f = e.target;
    run('saveNote', { key: f.dataset.key, date: f.dataset.date, name: f.dataset.name, legs: $('#evLegs').value.trim(), raceNotes: $('#evRace').value.trim() }, 'Evaluation saved');
    return;
  }
  if (e.target.id === 'weightForm') {
    const kg = num($('#wKg').value), date = $('#wDate').value || TODAY;
    if (!(kg > 20 && kg < 300)) { toast('Enter your weight in kg, for example 52.4.'); return; }
    run('addWeight', { date, kg }, `Saved ${kg.toFixed(1)} kg`);
    return;
  }
  if (e.target.id === 'mealForm') {
    const item = $('#mItem').value.trim(), kcal = $('#mKcal').value.trim(), date = $('#mDate').value || TODAY;
    if (!item || !num(kcal)) { toast('Add the food and its calories.'); return; }
    mealDraft.date = date;
    run('addMeal', { date, meal: mealDraft.meal, item, kcal: num(kcal) }, 'Added');
  }
});

// Inline "Actual km" field: saves on blur / Enter
document.addEventListener('change', e => {
  if (e.target.id === 'actPick') { if (e.target.value) loadActivity(e.target.value); return; }
  const inp = e.target.closest('[data-km]');
  if (!inp) return;
  const p = M.plan.find(x => String(x.row) === inp.dataset.km);
  const val = inp.value.trim();
  if (!p || num(val) === p.km) return;
  if (val === '') { run('clearSession', { logRow: p.row, date: p.date, activity: p.activity }, 'Cleared'); return; }
  run('saveSession', { logRow: p.row, date: p.date, activity: p.activity, prevActivity: p.activity, type: p.type, km: num(val) }, `${km1(num(val))} km saved`);
});
document.addEventListener('change', e => {
  if (e.target.id === 'gelG') { const g = Math.round(num(e.target.value)); if (g > 0) { GEL_G = g; try { localStorage.setItem('telemetry.gelG', g); } catch (_) {} if (sheetCtx && sheetCtx.fuel) openFuel(sheetCtx.fuel); } return; }
  const id = e.target.id, f = state.filter;
  if (!['fView', 'fType2', 'fFrom', 'fTo'].includes(id)) return;
  if (id === 'fView') { f.view = e.target.value; f.from = ''; f.to = ''; }
  if (id === 'fType2') f.type = e.target.value;
  if (id === 'fFrom') f.from = e.target.value;
  if (id === 'fTo') f.to = e.target.value;
  saveFilter(); const y = window.scrollY; render(); window.scrollTo(0, y);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-hist]')) { e.preventDefault(); e.target.click(); return; } if (e.key === 'Escape' && sheetCtx) closeSheet(); if (e.key === 'Enter' && e.target.matches('[data-km]')) e.target.blur(); });

/* ================= boot ================= */
function renderSetup(msg) {
  setSync('err', 'Not connected');
  view.innerHTML = `
    <h2 class="sec">Connect your sheet</h2>
    <p class="sub">Paste the Apps Script web app link and your key. They're saved on this device only.</p>
    <form class="card form" id="setupForm" autocomplete="off">
      <label class="f">Web app link<input id="sUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CONF.url)}" required></label>
      <label class="f">Key<input id="sKey" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" value="${esc(CONF.key)}" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
      ${msg ? `<p class="desc" style="color:var(--warn)">${esc(msg)}</p>` : ''}
      <button class="btn" type="submit">Connect</button>
    </form>`;
}

/* New-version check: GitHub Pages and iOS can keep serving an old copy of this page.
   version.json is fetched uncached; if it names a newer build, reload under a fresh URL. */
async function checkVersion() {
  if (IS_PREVIEW || !/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = (await r.json()).version;
    let tried = ''; try { tried = sessionStorage.getItem('telemetry.reloadedFor') || ''; } catch (e) {}
    if (v && v !== APP_VERSION && tried !== v) {
      try { sessionStorage.setItem('telemetry.reloadedFor', v); } catch (e) {}
      location.replace(location.pathname + '?v=' + encodeURIComponent(v));
    }
  } catch (e) {}
}

/* ---------- splash: the logo for 2 s, then a spinner until the data is in ---------- */
const SPLASH = { t0: Date.now(), ready: false, gone: false };
function splashHide() {
  const el = document.querySelector('#splash'); if (!el || !el.classList || SPLASH.gone) return;
  SPLASH.gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 500);
}
function splashDone() { SPLASH.ready = true; if (Date.now() - SPLASH.t0 >= 2000) splashHide(); }
setTimeout(() => { if (SPLASH.ready) splashHide(); else { const el = document.querySelector('#splash'); if (el && el.classList) el.classList.add('loading'); } }, 2000);
setTimeout(splashHide, 30000);   // never trap the app behind the splash

async function load() {
  checkVersion();
  $('#previewBanner').hidden = !IS_PREVIEW;
  if (!IS_PREVIEW && !CONF.ready) { renderSetup(); return; }
  setSync('busy', 'Loading');
  try {
    RAW = await API.call('getData');
    if (!RAW) throw new Error('No data');
    M = build(RAW);
    setSync('', IS_PREVIEW ? 'Preview' : 'Synced');
    render();
  } catch (e) {
    const msg = e && e.message ? e.message : String(e);
    if (/wrong key|failed to fetch|load failed|answered/i.test(msg)) { renderSetup('Could not connect: ' + msg + '. Check the link and key.'); return; }
    setSync('err', 'Offline');
    view.innerHTML = `<div class="card empty">Could not read the sheet: ${esc(msg)}.<br><br><button class="btn" id="retryBtn">Try again</button></div>`;
  }
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'setupForm') return;
  e.preventDefault();
  const url = $('#sUrl').value.trim(), key = $('#sKey').value.trim();
  setSync('busy', 'Connecting');
  try { await API.raw(url, key, 'getData'); CONF.save(url, key); load(); }
  catch (err) { renderSetup('Could not connect: ' + (err && err.message ? err.message : err) + '. Check the link and key.'); }
});
document.addEventListener('click', e => {
  if (e.target.closest('#retryBtn')) load();
  if (e.target.closest('#sync') && !IS_PREVIEW && M) renderSetup();
});
// roll over to the next day at DAY_START even if the app stays open
setInterval(() => { if (M && myDayNow().day !== TODAY) render(); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); if (document.visibilityState === 'visible' && !IS_PREVIEW && CONF.ready && M) API.call('getData').then(d => { RAW = d; M = build(d); render(); setSync('', 'Synced'); }).catch(() => {}); });
load().finally(splashDone);
</script>
